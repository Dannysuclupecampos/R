&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;grid&quot;&gt;
&lt;div&gt;&lt;label for=&quot;hto&quot;&gt;Hto (%)&lt;/label&gt;&lt;input id=&quot;hto&quot; type=&quot;number&quot; step=&quot;0.1&quot; inputmode=&quot;decimal&quot;&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;

&lt;textarea id=&quot;out&quot; readonly&gt;&lt;/textarea&gt;

&lt;p class=&quot;nt&quot;&gt;Cruces según tabla de correlación de la guía. Valores en brechas entre rangos de la tabla se asignan a la categoría contigua. Poiquilocitosis e inclusiones requieren frotis y no se calculan aquí. Herramienta de apoyo: validar siempre con el frotis.&lt;/p&gt;

&lt;script&gt;
var $=function(i){return document.getElementById(i)};
function num(i){var v=$(i).value;return v===&quot;&quot;?null:parseFloat(v)}

function calc(){
var hto=num(&quot;hto&quot;),hb=num(&quot;hb&quot;),vcm=num(&quot;vcm&quot;),hcm=num(&quot;hcm&quot;),chcm=num(&quot;chcm&quot;),ade=num(&quot;ade&quot;),adh=num(&quot;adh&quot;);

if(vcm!==null){
 if(vcm&lt;82){var n=vcm&gt;=70?1:(vcm&gt;=60?2:3);tam=&quot;microcíticos &quot;+cr(n);
  if(vcm&gt;=80)al.push([&quot;w&quot;,&quot;VCM 80–81,9 fL: la guía define micro ≤80 fL pero la tabla parte en 70. Se asignó (+).&quot;]);}
 else if(vcm&gt;=100){var m=vcm&lt;110?1:(vcm&lt;120?2:3);tam=&quot;macrocíticos &quot;+cr(m);}
 else {tam=&quot;normocíticos&quot;;if(vcm&gt;96)al.push([&quot;w&quot;,&quot;VCM 96–99,9 fL: sobre el rango normal de la guía, sin categoría. No se informa.&quot;]);}
}
if(hcm!==null){
 if(hcm&lt;28){var h=hcm&lt;16?3:(hcm&lt;22?2:1);cro=&quot;hipocrómicos &quot;+cr(h);}
 else if(hcm&lt;=32)cro=&quot;normocrómicos&quot;;

if(ani)out.push(ani);

if(er.length)out.push(&quot;Eritrocitos &quot;+er.join(&quot;, &quot;)+&quot;.&quot;);
if(anc)out.push(anc);

$(&quot;out&quot;).value=out.join(&quot; &quot;);
$(&quot;al&quot;).innerHTML=al.map(function(x){return &#x27;&lt;li class=&quot;&#x27;+x[0]+&#x27;&quot;&gt;&#x27;+x[1]+&#x27;&lt;/li&gt;&#x27;}).join(&quot;&quot;);

calc();
&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;h1&gt;Calculadora de Nugent / Hay-Ison&lt;/h1&gt;
  &lt;p class=&quot;subtitle&quot;&gt;Diagnóstico de vaginosis bacteriana por tinción de Gram&lt;/p&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;field&quot;&gt;
      &lt;label&gt;Bacilos grampositivos (Lactobacillus)&lt;/label&gt;
      &lt;select id=&quot;lacto&quot;&gt;
        &lt;option value=&quot;0&quot;&gt;&amp;gt;30 por campo&lt;/option&gt;
        &lt;option value=&quot;1&quot;&gt;5-30 por campo&lt;/option&gt;
        &lt;option value=&quot;2&quot;&gt;1-4 por campo&lt;/option&gt;
        &lt;option value=&quot;3&quot;&gt;&amp;lt;1 por campo&lt;/option&gt;
        &lt;option value=&quot;4&quot;&gt;0 por campo&lt;/option&gt;
      &lt;/select&gt;
    &lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;
      &lt;label&gt;Bacilos gramnegativos (Gardnerella / Bacteroides)&lt;/label&gt;
      &lt;select id=&quot;gard&quot;&gt;
        &lt;option value=&quot;4&quot;&gt;&amp;gt;30 por campo&lt;/option&gt;
        &lt;option value=&quot;3&quot;&gt;5-30 por campo&lt;/option&gt;
        &lt;option value=&quot;2&quot;&gt;1-4 por campo&lt;/option&gt;
        &lt;option value=&quot;1&quot;&gt;&amp;lt;1 por campo&lt;/option&gt;
        &lt;option value=&quot;0&quot;&gt;0 por campo&lt;/option&gt;
      &lt;/select&gt;
    &lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;
      &lt;label&gt;Bacilos Gram-variables curvos (Mobiluncus)&lt;/label&gt;
      &lt;select id=&quot;curv&quot;&gt;
        &lt;option value=&quot;2&quot;&gt;&amp;gt;5 por campo&lt;/option&gt;
        &lt;option value=&quot;1&quot;&gt;&amp;lt;1-4 por campo&lt;/option&gt;
        &lt;option value=&quot;0&quot;&gt;0 por campo&lt;/option&gt;
      &lt;/select&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;result-card&quot;&gt;
    &lt;p class=&quot;result-label&quot;&gt;Puntuación de Nugent (0-10)&lt;/p&gt;
    &lt;p class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/p&gt;
    &lt;p class=&quot;interp&quot; id=&quot;interp&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;label&gt;Correlación Hay/Ison (opcional, morfología observada)&lt;/label&gt;
    &lt;select id=&quot;hayison&quot;&gt;
      &lt;option value=&quot;&quot;&gt;— No evaluado —&lt;/option&gt;
      &lt;option value=&quot;1&quot;&gt;Grado 1 — normal (predominio Lactobacillus)&lt;/option&gt;
      &lt;option value=&quot;2&quot;&gt;Grado 2 — intermedio (flora mixta)&lt;/option&gt;
      &lt;option value=&quot;3&quot;&gt;Grado 3 — vaginosis bacteriana (Gardnerella/Mobiluncus)&lt;/option&gt;
    &lt;/select&gt;
    &lt;p class=&quot;hay-out&quot; id=&quot;hayison-out&quot;&gt;&lt;/p&gt;
    &lt;div class=&quot;hr&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;table-title&quot;&gt;Referencia de interpretación&lt;/p&gt;
    &lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Puntuación&lt;/th&gt;&lt;th&gt;Interpretación&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;0-3&lt;/td&gt;&lt;td&gt;Normal&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;4-6&lt;/td&gt;&lt;td&gt;Intermedio&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;7-10&lt;/td&gt;&lt;td&gt;Vaginosis bacteriana&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;label&gt;Criterios de Amsel&lt;/label&gt;
    &lt;label class=&quot;amsel-item&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;amsel&quot;&gt; Flujo vaginal homogéneo, filante, blanco o gris&lt;/label&gt;
    &lt;label class=&quot;amsel-item&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;amsel&quot;&gt; Células clave (clue cells) en el examen microscópico&lt;/label&gt;
    &lt;label class=&quot;amsel-item&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;amsel&quot;&gt; pH vaginal &amp;gt; 4.5&lt;/label&gt;
    &lt;label class=&quot;amsel-item&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;amsel&quot;&gt; Olor a aminas (pescado) tras KOH al 10%&lt;/label&gt;

    &lt;div class=&quot;result-card&quot; style=&quot;margin-top:14px; margin-bottom:0;&quot;&gt;
      &lt;p class=&quot;result-label&quot;&gt;Criterios de Amsel cumplidos&lt;/p&gt;
      &lt;p class=&quot;score&quot; id=&quot;amsel-score&quot; style=&quot;font-size:28px;&quot;&gt;0/4&lt;/p&gt;
      &lt;p class=&quot;interp&quot; id=&quot;amsel-interp&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;p style=&quot;font-size:12px; color:var(--text-secondary); margin-top:10px;&quot;&gt;Requiere 3/4 para el diagnóstico.&lt;/p&gt;
  &lt;/div&gt;

  &lt;footer&gt;Criterios de Nugent, Hay/Ison y Amsel — referencia clínica&lt;/footer&gt;
&lt;/div&gt;

&lt;script&gt;
function calc(){
  var l = parseInt(document.getElementById(&#x27;lacto&#x27;).value);
  var g = parseInt(document.getElementById(&#x27;gard&#x27;).value);
  var c = parseInt(document.getElementById(&#x27;curv&#x27;).value);
  var total = l + g + c;
  document.getElementById(&#x27;score&#x27;).textContent = total;
  var interpEl = document.getElementById(&#x27;interp&#x27;);
  var label, color;
  if(total &lt;= 3){ label = &#x27;Normal&#x27;; color = &#x27;var(--success)&#x27;; }
  else if(total &lt;= 6){ label = &#x27;Intermedio&#x27;; color = &#x27;var(--warning)&#x27;; }
  else { label = &#x27;Vaginosis bacteriana&#x27;; color = &#x27;var(--danger)&#x27;; }
  interpEl.textContent = label;
  interpEl.style.color = color;
}
document.getElementById(&#x27;lacto&#x27;).addEventListener(&#x27;change&#x27;, calc);
document.getElementById(&#x27;gard&#x27;).addEventListener(&#x27;change&#x27;, calc);
document.getElementById(&#x27;curv&#x27;).addEventListener(&#x27;change&#x27;, calc);

function hayCalc(){
  var v = document.getElementById(&#x27;hayison&#x27;).value;
  var out = document.getElementById(&#x27;hayison-out&#x27;);
  var texts = {
    &#x27;1&#x27;: &#x27;Concordante con Nugent 0-3.&#x27;,
    &#x27;2&#x27;: &#x27;Concordante con Nugent 4-6.&#x27;,
    &#x27;3&#x27;: &#x27;Concordante con Nugent 7-10.&#x27;
  };
  out.textContent = texts[v] || &#x27;&#x27;;
}
document.getElementById(&#x27;hayison&#x27;).addEventListener(&#x27;change&#x27;, hayCalc);

function amselCalc(){
  var boxes = document.querySelectorAll(&#x27;.amsel&#x27;);
  var count = 0;
  boxes.forEach(function(b){ if(b.checked) count++; });
  document.getElementById(&#x27;amsel-score&#x27;).textContent = count + &#x27;/4&#x27;;
  var interpEl = document.getElementById(&#x27;amsel-interp&#x27;);
  if(count &gt;= 3){
    interpEl.textContent = &#x27;Diagnóstico positivo de vaginosis bacteriana&#x27;;
    interpEl.style.color = &#x27;var(--danger)&#x27;;
  } else {
    interpEl.textContent = &#x27;No cumple criterio diagnóstico (se requieren ≥3/4)&#x27;;
    interpEl.style.color = &#x27;var(--text-secondary)&#x27;;
  }
}
document.querySelectorAll(&#x27;.amsel&#x27;).forEach(function(b){
  b.addEventListener(&#x27;change&#x27;, amselCalc);
});

calc();
amselCalc();
&lt;/script&gt;

&lt;body&gt;
&lt;main&gt;
&lt;h1&gt;Calculadora de puntaje ITU&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Estándar de referencia para investigación en ITU · Bilsen et al., Lancet Infect Dis 2024 (consenso Delphi)&lt;/p&gt;
&lt;p class=&quot;scope&quot;&gt;Adultos (incluye mayores). No aplica a ITU asociada a sonda permanente. Es una herramienta de investigación, no de decisión clínica.&lt;/p&gt;

&lt;form id=&quot;f&quot; onsubmit=&quot;return false&quot; autocomplete=&quot;off&quot;&gt;

&lt;section&gt;
  &lt;div class=&quot;sh&quot;&gt;&lt;h2&gt;Paciente&lt;/h2&gt;&lt;/div&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;f&quot;&gt;&lt;span class=&quot;l&quot;&gt;Sexo asignado al nacer&lt;/span&gt;
      &lt;div class=&quot;seg&quot; role=&quot;radiogroup&quot; aria-label=&quot;Sexo&quot;&gt;
        &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;sex&quot; value=&quot;F&quot; checked&gt;&lt;span&gt;Mujer&lt;/span&gt;&lt;/label&gt;
        &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;sex&quot; value=&quot;M&quot;&gt;&lt;span&gt;Hombre&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;&lt;/div&gt;
    &lt;label class=&quot;f&quot;&gt;&lt;span class=&quot;l&quot;&gt;Edad (años)&lt;/span&gt;&lt;input id=&quot;age&quot; type=&quot;number&quot; inputmode=&quot;numeric&quot; min=&quot;18&quot; max=&quot;120&quot; placeholder=&quot;ej. 70&quot;&gt;&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;f&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;l&quot;&gt;¿Puede expresar o percibir síntomas urinarios bajos?&lt;/span&gt;
    &lt;div class=&quot;seg&quot; role=&quot;radiogroup&quot; aria-label=&quot;Capacidad de expresar síntomas&quot;&gt;
      &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;capable&quot; value=&quot;yes&quot; checked&gt;&lt;span&gt;Sí&lt;/span&gt;&lt;/label&gt;
      &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;capable&quot; value=&quot;no&quot;&gt;&lt;span&gt;No&lt;/span&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;span class=&quot;hint&quot;&gt;Ej. de &quot;No&quot;: delirium, demencia, lesión medular.&lt;/span&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;div class=&quot;sh&quot;&gt;&lt;h2&gt;Síntomas y signos de inicio reciente&lt;/h2&gt;&lt;span class=&quot;chip&quot; id=&quot;chip_sym&quot;&gt;0 pts&lt;/span&gt;&lt;/div&gt;
  &lt;div id=&quot;symbox&quot;&gt;
    &lt;div class=&quot;grp&quot;&gt;Mayores&lt;/div&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;s_dys&quot;&gt;Disuria&lt;/label&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;s_urg&quot;&gt;Urgencia urinaria&lt;/label&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;s_freq&quot;&gt;Frecuencia urinaria&lt;/label&gt;
    &lt;div class=&quot;grp&quot;&gt;Menores&lt;/div&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;s_supra&quot;&gt;Dolor o sensibilidad suprapúbica&lt;/label&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;s_flank&quot;&gt;Dolor o sensibilidad en flanco / ángulo costovertebral&lt;/label&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;s_perin&quot;&gt;Dolor perineal o tacto prostático doloroso&lt;/label&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;s_incont&quot;&gt;Incontinencia urinaria&lt;/label&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;s_hemat&quot;&gt;Hematuria macroscópica&lt;/label&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;s_recog&quot;&gt;Reconocimiento de los síntomas por el paciente&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;hint hide&quot; id=&quot;symnote&quot;&gt;Sin capacidad de expresar síntomas: el dominio suma 1 punto.&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;div class=&quot;sh&quot;&gt;&lt;h2&gt;Criterios sistémicos&lt;/h2&gt;&lt;span class=&quot;chip&quot; id=&quot;chip_sys&quot;&gt;0 pts&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;hint&quot;&gt;Marca solo si son de inicio reciente y sin otra fuente plausible (historia y examen).&lt;/p&gt;
  &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;y_fever&quot;&gt;Fiebre ≥38,0 °C&lt;/label&gt;
  &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;y_crp&quot;&gt;PCR ≥50 mg/L&lt;/label&gt;
  &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;y_pct&quot;&gt;Procalcitonina ≥0,5 ng/mL&lt;/label&gt;
  &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;y_wbc&quot;&gt;Leucocitos en sangre ≥12×10⁹/L&lt;/label&gt;
  &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;y_bact&quot;&gt;Bacteriemia (mismo patógeno que el urocultivo)&lt;/label&gt;
  &lt;div class=&quot;grp&quot;&gt;Solo para clasificar compromiso sistémico (no suman)&lt;/div&gt;
  &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;y_sbp&quot;&gt;PAS &amp;lt;90 mm Hg sin otra causa&lt;/label&gt;
  &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;y_abs&quot;&gt;Absceso renal&lt;/label&gt;
  &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;y_pyo&quot;&gt;Pionefrosis&lt;/label&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;div class=&quot;sh&quot;&gt;&lt;h2&gt;Piuria&lt;/h2&gt;&lt;span class=&quot;chip&quot; id=&quot;chip_pyu&quot;&gt;— pts&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;hint&quot;&gt;Debe estar cuantificada (microscopía o analizador). La tira reactiva (esterasa leucocitaria) no es suficiente en el estándar principal.&lt;/p&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;label class=&quot;f&quot;&gt;&lt;span class=&quot;l&quot;&gt;Leucocitos en orina&lt;/span&gt;&lt;input id=&quot;p_val&quot; type=&quot;number&quot; inputmode=&quot;decimal&quot; min=&quot;0&quot; placeholder=&quot;valor&quot;&gt;&lt;/label&gt;
    &lt;label class=&quot;f&quot;&gt;&lt;span class=&quot;l&quot;&gt;Unidad&lt;/span&gt;
      &lt;select id=&quot;p_unit&quot;&gt;&lt;option value=&quot;ul&quot;&gt;por µL&lt;/option&gt;&lt;option value=&quot;hpf&quot;&gt;por campo de alto poder (hpf)&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
  &lt;/div&gt;
  &lt;label class=&quot;opt&quot; style=&quot;margin-top:6px&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;p_exc&quot;&gt;&lt;span&gt;Uropatía obstructiva completa o neutropenia absoluta&lt;small&gt;La piuria puede estar ausente; se calcula el puntaje igualmente.&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;div class=&quot;sh&quot;&gt;&lt;h2&gt;Urocultivo&lt;/h2&gt;&lt;span class=&quot;chip&quot; id=&quot;chip_cul&quot;&gt;0 pts&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;f&quot;&gt;&lt;span class=&quot;l&quot;&gt;Estado&lt;/span&gt;
    &lt;div class=&quot;seg&quot; role=&quot;radiogroup&quot; aria-label=&quot;Estado del urocultivo&quot;&gt;
      &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;cstat&quot; value=&quot;none&quot; checked&gt;&lt;span&gt;No realizado&lt;/span&gt;&lt;/label&gt;
      &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;cstat&quot; value=&quot;nogrowth&quot;&gt;&lt;span&gt;Sin desarrollo&lt;/span&gt;&lt;/label&gt;
      &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;cstat&quot; value=&quot;growth&quot;&gt;&lt;span&gt;Con desarrollo&lt;/span&gt;&lt;/label&gt;
    &lt;/div&gt;&lt;/div&gt;
  &lt;div id=&quot;c_ng&quot; class=&quot;hide&quot;&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;c_pre&quot;&gt;Tratado previamente con antimicrobianos&lt;/label&gt;
  &lt;/div&gt;
  &lt;div id=&quot;c_gr&quot; class=&quot;hide&quot;&gt;
    &lt;div class=&quot;f&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;l&quot;&gt;Tipo de muestra&lt;/span&gt;
      &lt;div class=&quot;seg&quot; role=&quot;radiogroup&quot; aria-label=&quot;Tipo de muestra&quot;&gt;
        &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;csample&quot; value=&quot;mid&quot; checked&gt;&lt;span&gt;Chorro medio&lt;/span&gt;&lt;/label&gt;
        &lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;csample&quot; value=&quot;cath&quot;&gt;&lt;span&gt;Sonda única (in-out)&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;grp&quot;&gt;Microorganismos aislados&lt;/div&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;org&quot; id=&quot;o_ecoli&quot;&gt;Escherichia coli&lt;/label&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;org&quot; id=&quot;o_ent&quot;&gt;Otras Enterobacterales (Klebsiella, Proteus, etc.)&lt;/label&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;org&quot; id=&quot;o_pse&quot;&gt;Pseudomonas aeruginosa&lt;/label&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;org&quot; id=&quot;o_sap&quot;&gt;Staphylococcus saprophyticus&lt;/label&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;org&quot; id=&quot;o_oth&quot;&gt;Otro patógeno (Enterococcus, S. agalactiae, S. aureus, etc.)&lt;/label&gt;
    &lt;label class=&quot;opt&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;o_mix&quot;&gt;Flora mixta&lt;/label&gt;
    &lt;label class=&quot;f&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span class=&quot;l&quot;&gt;Recuento (UFC/mL)&lt;/span&gt;
      &lt;select id=&quot;c_cfu&quot;&gt;
        &lt;option value=&quot;2&quot;&gt;&amp;lt;10³&lt;/option&gt;
        &lt;option value=&quot;3&quot;&gt;10³ a &amp;lt;10⁴&lt;/option&gt;
        &lt;option value=&quot;4&quot; selected&gt;≥10⁴&lt;/option&gt;
      &lt;/select&gt;&lt;/label&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;div class=&quot;sh&quot;&gt;&lt;h2&gt;Resultado&lt;/h2&gt;&lt;/div&gt;
  &lt;div id=&quot;bd&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;sys&quot; id=&quot;sysbox&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;warns&quot;&gt;&lt;/div&gt;
  &lt;div style=&quot;margin-top:14px&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;copy&quot; id=&quot;copy&quot;&gt;Copiar resumen&lt;/button&gt; &lt;span class=&quot;hint&quot; id=&quot;copied&quot;&gt;&lt;/span&gt;&lt;/div&gt;

  &lt;details&gt;
    &lt;summary&gt;Supuestos de implementación&lt;/summary&gt;
    &lt;ul&gt;
      &lt;li&gt;Umbral de entrada: piuria ≥10 leucocitos/µL o ≥5/hpf. Sin síntomas ni signos nuevos (si el paciente puede expresarlos) o sin piuria suficiente, el flujo termina en &quot;No ITU&quot;.&lt;/li&gt;
      &lt;li&gt;Mujer ≥65 años: +1 en síntomas con ≥2 mayores; −1 en piuria intermedia (10–200/µL o 5–50/hpf); −1 en urocultivo positivo. La ubicación de cada deducción sigue el esquema de la figura 1.&lt;/li&gt;
      &lt;li&gt;Bacteriemia con el mismo patógeno: 3 pts en cultivo (+2 en sistémicos) y sin deducción por edad.&lt;/li&gt;
      &lt;li&gt;Más de 2 uropatógenos típicos se trata como flora mixta (1 pt). Uropatógeno típico bajo el umbral: el artículo no define puntaje; aquí se asigna 0.&lt;/li&gt;
      &lt;li&gt;Umbrales de cultivo: chorro medio ≥10⁴ UFC/mL (E. coli ≥10³); sonda única ≥10³. Enterococcus y S. agalactiae no son uropatógenos típicos (1 pt); si crecen junto a un típico, se puntúa el típico.&lt;/li&gt;
      &lt;li&gt;Categorías: ≥8 definitiva · 5–7 probable · 3–4 posible · 0–2 no ITU.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/details&gt;
  &lt;p class=&quot;foot&quot;&gt;Basado en Bilsen MP, et al. Lancet Infect Dis 2024. doi:10.1016/S1473-3099(23)00778-8. No incluye la versión suplementaria con tira reactiva (apéndice del artículo).&lt;/p&gt;
&lt;/section&gt;
&lt;/form&gt;
&lt;/main&gt;

&lt;div class=&quot;bar&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;
  &lt;div class=&quot;bar-in&quot;&gt;
    &lt;div class=&quot;bar-top&quot;&gt;&lt;div class=&quot;cat&quot; id=&quot;cat&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;score&quot;&gt;&lt;span id=&quot;tot&quot;&gt;—&lt;/span&gt;&lt;small&gt;puntos&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;gauge&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;b class=&quot;mk off&quot; id=&quot;mk&quot;&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;scale&quot;&gt;&lt;span&gt;0–2&lt;/span&gt;&lt;span&gt;3–4&lt;/span&gt;&lt;span&gt;5–7&lt;/span&gt;&lt;span&gt;≥8&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sub2&quot; id=&quot;why&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const $ = id =&gt; document.getElementById(id);
const chk = id =&gt; $(id).checked;
const val = name =&gt; document.querySelector(&#x27;input[name=&quot;&#x27;+name+&#x27;&quot;]:checked&#x27;).value;
const pts = n =&gt; n + (n === 1 ? &#x27; pt&#x27; : &#x27; pts&#x27;);

function compute(){
  const R = {pending:[], warns:[], rows:[]};
  const sex = val(&#x27;sex&#x27;);
  const age = parseFloat($(&#x27;age&#x27;).value);
  if (sex === &#x27;F&#x27; &amp;&amp; isNaN(age)) R.pending.push(&#x27;edad&#x27;);
  const old = sex === &#x27;F&#x27; &amp;&amp; age &gt;= 65;
  const capable = val(&#x27;capable&#x27;) === &#x27;yes&#x27;;

  // Síntomas y signos
  const majors = [&#x27;s_dys&#x27;,&#x27;s_urg&#x27;,&#x27;s_freq&#x27;].filter(chk).length;
  const minors = [&#x27;s_supra&#x27;,&#x27;s_flank&#x27;,&#x27;s_perin&#x27;,&#x27;s_incont&#x27;,&#x27;s_hemat&#x27;,&#x27;s_recog&#x27;].filter(chk).length;
  let sym = 0, symTxt = &#x27;Sin síntomas nuevos&#x27;;
  if (!capable){ sym = 1; symTxt = &#x27;No puede expresar síntomas&#x27;; }
  else if (majors &gt;= 2){ sym = 3 + (old ? 1 : 0); symTxt = &#x27;≥2 síntomas mayores&#x27; + (old ? &#x27; (+1 mujer ≥65)&#x27; : &#x27;&#x27;); }
  else if (majors === 1 || minors &gt;= 2){ sym = 2; symTxt = majors === 1 ? &#x27;1 síntoma mayor&#x27; : &#x27;2 o más síntomas menores&#x27;; }
  else if (minors === 1){ sym = 1; symTxt = &#x27;1 síntoma menor&#x27;; }
  R.sym = sym;
  R.rows.push([&#x27;Síntomas y signos&#x27;, symTxt, sym]);

  // Sistémicos
  const sysAny = [&#x27;y_fever&#x27;,&#x27;y_crp&#x27;,&#x27;y_pct&#x27;,&#x27;y_wbc&#x27;,&#x27;y_bact&#x27;].some(chk);
  const sys = sysAny ? 2 : 0;
  R.sys = sys;
  R.rows.push([&#x27;Criterios sistémicos&#x27;, sysAny ? &#x27;≥1 criterio nuevo&#x27; : &#x27;Ninguno&#x27;, sys]);

  // Piuria
  const pv = parseFloat($(&#x27;p_val&#x27;).value), unit = $(&#x27;p_unit&#x27;).value;
  const lo = unit === &#x27;ul&#x27; ? 10 : 5, hi = unit === &#x27;ul&#x27; ? 200 : 50;
  const exc = chk(&#x27;p_exc&#x27;);
  let pyu = 0, pyuTxt = &#x27;&#x27;, entryMet = false, pyuPending = false;
  if (isNaN(pv)){ pyuPending = true; pyuTxt = &#x27;Sin dato&#x27;; }
  else if (pv &gt;= hi){ pyu = 3; entryMet = true; pyuTxt = &#x27;Piuria alta (≥&#x27; + hi + (unit===&#x27;ul&#x27;?&#x27;/µL&#x27;:&#x27;/hpf&#x27;) + &#x27;)&#x27;; }
  else if (pv &gt;= lo){ pyu = 2 - (old ? 1 : 0); entryMet = true; pyuTxt = &#x27;Piuria intermedia&#x27; + (old ? &#x27; (−1 mujer ≥65)&#x27; : &#x27;&#x27;); }
  else { pyuTxt = &#x27;Bajo el umbral de entrada&#x27;; }
  R.pyu = pyu;
  R.rows.push([&#x27;Piuria&#x27;, pyuTxt, pyuPending ? null : pyu]);

  // Urocultivo
  const bact = chk(&#x27;y_bact&#x27;);
  const cstat = val(&#x27;cstat&#x27;);
  let cul = 0, culTxt = &#x27;No realizado&#x27;, culPending = false;
  if (bact){ cul = 3; culTxt = &#x27;Bacteriemia con mismo patógeno&#x27;; }
  else if (cstat === &#x27;none&#x27;){ cul = 0; culTxt = &#x27;No realizado&#x27;; }
  else if (cstat === &#x27;nogrowth&#x27;){ cul = chk(&#x27;c_pre&#x27;) ? 1 : 0; culTxt = chk(&#x27;c_pre&#x27;) ? &#x27;Sin desarrollo, con tratamiento previo&#x27; : &#x27;Sin desarrollo, sin tratamiento previo&#x27;; }
  else {
    const typ = [&#x27;o_ecoli&#x27;,&#x27;o_ent&#x27;,&#x27;o_pse&#x27;,&#x27;o_sap&#x27;].filter(chk).length;
    const oth = chk(&#x27;o_oth&#x27;), mix = chk(&#x27;o_mix&#x27;);
    const cfu = parseInt($(&#x27;c_cfu&#x27;).value, 10);
    const cath = val(&#x27;csample&#x27;) === &#x27;cath&#x27;;
    if (mix){ cul = 1; culTxt = &#x27;Flora mixta&#x27;; }
    else if (typ &gt; 2){ cul = 1; culTxt = &#x27;&gt;2 uropatógenos (tratado como flora mixta)&#x27;; R.warns.push(&#x27;Más de 2 uropatógenos típicos: se asignó 1 pt como flora mixta (supuesto, no explícito en el artículo).&#x27;); }
    else if (typ &gt;= 1){
      const thr = cath ? 3 : (chk(&#x27;o_ecoli&#x27;) ? 3 : 4);
      if (cfu &gt;= thr){ cul = 3 - (old ? 1 : 0); culTxt = &#x27;Uropatógeno ≥10&#x27; + (thr===3?&#x27;³&#x27;:&#x27;⁴&#x27;) + &#x27; UFC/mL&#x27; + (old ? &#x27; (−1 mujer ≥65)&#x27; : &#x27;&#x27;); }
      else { cul = 0; culTxt = &#x27;Uropatógeno bajo el umbral&#x27;; R.warns.push(&#x27;Uropatógeno típico bajo el umbral de recuento: el artículo no asigna puntaje a este caso; se asignó 0.&#x27;); }
    }
    else if (oth){ cul = 1; culTxt = &#x27;Otro patógeno&#x27;; }
    else { culPending = true; culTxt = &#x27;Selecciona el microorganismo&#x27;; R.pending.push(&#x27;microorganismo&#x27;); }
  }
  R.cul = cul;
  R.rows.push([&#x27;Urocultivo&#x27;, culTxt, culPending ? null : cul]);

  // Entrada del flujo
  const anyNew = (majors + minors &gt; 0) || sysAny || chk(&#x27;y_sbp&#x27;);
  R.gate = null;
  if (capable &amp;&amp; !anyNew) R.gate = &#x27;Sin síntomas ni signos nuevos&#x27;;
  else if (pyuPending &amp;&amp; !exc) R.pending.push(&#x27;piuria&#x27;);
  else if (!entryMet &amp;&amp; !exc &amp;&amp; !pyuPending) R.gate = &#x27;Piuria bajo el umbral de entrada&#x27;;

  R.total = sym + sys + pyu + cul;
  if (R.gate) R.cat = &#x27;No ITU&#x27;;
  else if (R.pending.length) R.cat = null;
  else if (R.total &gt;= 8) R.cat = &#x27;ITU definitiva&#x27;;
  else if (R.total &gt;= 5) R.cat = &#x27;ITU probable&#x27;;
  else if (R.total &gt;= 3) R.cat = &#x27;ITU posible&#x27;;
  else R.cat = &#x27;No ITU&#x27;;

  R.sysInv = [
    chk(&#x27;y_fever&#x27;) &amp;&amp; &#x27;fiebre&#x27;, chk(&#x27;s_flank&#x27;) &amp;&amp; &#x27;dolor en flanco / ángulo costovertebral&#x27;,
    chk(&#x27;y_sbp&#x27;) &amp;&amp; &#x27;PAS &lt;90 mm Hg&#x27;, (chk(&#x27;y_crp&#x27;)||chk(&#x27;y_pct&#x27;)||chk(&#x27;y_wbc&#x27;)) &amp;&amp; &#x27;marcadores inflamatorios elevados&#x27;,
    chk(&#x27;y_bact&#x27;) &amp;&amp; &#x27;bacteriemia&#x27;, chk(&#x27;y_abs&#x27;) &amp;&amp; &#x27;absceso renal&#x27;, chk(&#x27;y_pyo&#x27;) &amp;&amp; &#x27;pionefrosis&#x27;
  ].filter(Boolean);
  R.exc = exc; R.old = old;
  return R;
}

function colorFor(cat){
  return {&#x27;ITU definitiva&#x27;:&#x27;var(--c-def)&#x27;,&#x27;ITU probable&#x27;:&#x27;var(--c-pro)&#x27;,&#x27;ITU posible&#x27;:&#x27;var(--c-pos)&#x27;,&#x27;No ITU&#x27;:&#x27;var(--c-no)&#x27;}[cat] || &#x27;var(--muted)&#x27;;
}

function render(){
  // visibilidad
  const capable = val(&#x27;capable&#x27;) === &#x27;yes&#x27;;
  $(&#x27;symbox&#x27;).classList.toggle(&#x27;dim&#x27;, !capable);
  $(&#x27;symnote&#x27;).classList.toggle(&#x27;hide&#x27;, capable);
  const cs = val(&#x27;cstat&#x27;);
  $(&#x27;c_ng&#x27;).classList.toggle(&#x27;hide&#x27;, cs !== &#x27;nogrowth&#x27;);
  $(&#x27;c_gr&#x27;).classList.toggle(&#x27;hide&#x27;, cs !== &#x27;growth&#x27;);

  const R = compute();
  $(&#x27;chip_sym&#x27;).textContent = pts(R.sym);
  $(&#x27;chip_sys&#x27;).textContent = pts(R.sys);
  $(&#x27;chip_pyu&#x27;).textContent = R.rows[2][2] === null ? &#x27;— pts&#x27; : pts(R.pyu);
  $(&#x27;chip_cul&#x27;).textContent = R.rows[3][2] === null ? &#x27;— pts&#x27; : pts(R.cul);

  // barra fija
  const cat = $(&#x27;cat&#x27;), tot = $(&#x27;tot&#x27;), mk = $(&#x27;mk&#x27;), why = $(&#x27;why&#x27;);
  if (R.gate){
    cat.textContent = &#x27;No ITU&#x27;; cat.style.color = colorFor(&#x27;No ITU&#x27;);
    tot.textContent = &#x27;—&#x27;; mk.classList.add(&#x27;off&#x27;);
    why.textContent = &#x27;El flujo termina aquí: &#x27; + R.gate.toLowerCase() + &#x27;.&#x27;;
  } else if (R.pending.length){
    cat.textContent = &#x27;Faltan datos&#x27;; cat.style.color = &#x27;var(--muted)&#x27;;
    tot.textContent = &#x27;—&#x27;; mk.classList.add(&#x27;off&#x27;);
    why.textContent = &#x27;Completa: &#x27; + R.pending.join(&#x27;, &#x27;) + &#x27;.&#x27;;
  } else {
    cat.textContent = R.cat; cat.style.color = colorFor(R.cat);
    tot.textContent = R.total;
    mk.classList.remove(&#x27;off&#x27;);
    mk.style.left = ((Math.min(R.total, 11) + 0.5) / 12 * 100) + &#x27;%&#x27;;
    why.textContent = &#x27;&#x27;;
  }

  // tabla
  let h = &#x27;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Dominio&lt;/th&gt;&lt;th&gt;Criterio&lt;/th&gt;&lt;th style=&quot;text-align:right&quot;&gt;Pts&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
  R.rows.forEach(r =&gt; { h += &#x27;&lt;tr&gt;&lt;td&gt;&#x27; + r[0] + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + r[1] + &#x27;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&#x27; + (r[2] === null ? &#x27;—&#x27; : r[2]) + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;; });
  h += &#x27;&lt;/tbody&gt;&lt;tfoot&gt;&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;Total&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&#x27; + ((R.pending.length || R.gate) ? &#x27;—&#x27; : R.total) + &#x27;&lt;/td&gt;&lt;/tr&gt;&lt;/tfoot&gt;&lt;/table&gt;&#x27;;
  $(&#x27;bd&#x27;).innerHTML = h;

  // compromiso sistémico
  const sb = $(&#x27;sysbox&#x27;);
  if (R.gate || R.pending.length || R.cat === &#x27;No ITU&#x27;){ sb.classList.add(&#x27;hide&#x27;); }
  else {
    sb.classList.remove(&#x27;hide&#x27;);
    sb.textContent = R.sysInv.length
      ? &#x27;ITU con compromiso sistémico (&#x27; + R.sysInv.join(&#x27;; &#x27;) + &#x27;).&#x27;
      : &#x27;ITU sin compromiso sistémico.&#x27;;
  }

  // avisos
  let w = &#x27;&#x27;;
  R.warns.forEach(x =&gt; w += &#x27;&lt;div class=&quot;note&quot;&gt;&#x27; + x + &#x27;&lt;/div&gt;&#x27;);
  if (R.exc) w += &#x27;&lt;div class=&quot;note&quot;&gt;Excepción activa: se omite la piuria como criterio de entrada.&lt;/div&gt;&#x27;;
  if (R.old &amp;&amp; !R.gate &amp;&amp; R.cat === &#x27;ITU posible&#x27;) w += &#x27;&#x27;;
  $(&#x27;warns&#x27;).innerHTML = w;

  window.__R = R;
}

function summary(){
  const R = window.__R;
  let t = &#x27;Puntaje ITU (Bilsen 2024)\n&#x27;;
  R.rows.forEach(r =&gt; t += r[0] + &#x27;: &#x27; + (r[2] === null ? &#x27;—&#x27; : r[2]) + &#x27; (&#x27; + r[1] + &#x27;)\n&#x27;);
  if (R.gate) t += &#x27;Resultado: No ITU (&#x27; + R.gate + &#x27;)&#x27;;
  else if (R.pending.length) t += &#x27;Incompleto: falta &#x27; + R.pending.join(&#x27;, &#x27;);
  else {
    t += &#x27;Total: &#x27; + R.total + &#x27; → &#x27; + R.cat;
    if (R.cat !== &#x27;No ITU&#x27;) t += R.sysInv.length ? &#x27; con compromiso sistémico&#x27; : &#x27; sin compromiso sistémico&#x27;;
  }
  return t;
}

// exclusividad flora mixta vs organismos
document.querySelectorAll(&#x27;.org&#x27;).forEach(el =&gt; el.addEventListener(&#x27;change&#x27;, () =&gt; { if (el.checked) $(&#x27;o_mix&#x27;).checked = false; }));
$(&#x27;o_mix&#x27;).addEventListener(&#x27;change&#x27;, () =&gt; { if ($(&#x27;o_mix&#x27;).checked) document.querySelectorAll(&#x27;.org&#x27;).forEach(e =&gt; e.checked = false); });

$(&#x27;f&#x27;).addEventListener(&#x27;input&#x27;, render);
$(&#x27;f&#x27;).addEventListener(&#x27;change&#x27;, render);

$(&#x27;copy&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
  const t = summary();
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch(e) {}
  if (!ok){
    try {
      const ta = document.createElement(&#x27;textarea&#x27;); ta.value = t; document.body.appendChild(ta);
      ta.select(); ok = document.execCommand(&#x27;copy&#x27;); document.body.removeChild(ta);
    } catch(e) {}
  }
  $(&#x27;copied&#x27;).textContent = ok ? &#x27;Copiado&#x27; : &#x27;No se pudo copiar&#x27;;
  setTimeout(() =&gt; $(&#x27;copied&#x27;).textContent = &#x27;&#x27;, 2500);
});

render();
&lt;/script&gt;

  /* CARD */

  select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,112,192,0.1); }

  .toggle-btn.active { background: rgba(0,112,192,0.1); border-color: var(--accent); color: var(--accent); }

  /* MOTILITY INPUTS */
  .mot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .mot-field { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .mot-field-label { font-size: 11px; font-weight: 600; margin-bottom: 3px; }
  .mot-field-sub { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
  .mot-field input { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--mono); font-size: 14px; padding: 6px 10px; width: 100%; outline: none; }
  .mot-field input:focus { border-color: var(--accent); }
  .cat-pr { border-left: 3px solid #0070c0; }
  .cat-ps { border-left: 3px solid #00a8cc; }
  .cat-np { border-left: 3px solid #f59e0b; }
  .cat-im { border-left: 3px solid #94a3b8; }

  /* BUTTONS */
  .btn-calc { width: 100%; background: linear-gradient(135deg,rgba(0,112,192,0.12),rgba(10,171,110,0.08)); border: 1px solid var(--accent); border-radius: 10px; color: var(--accent); font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; padding: 13px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; margin-top: 4px; }
  .btn-calc:hover { background: linear-gradient(135deg,rgba(0,112,192,0.2),rgba(10,171,110,0.15)); box-shadow: 0 0 16px rgba(0,112,192,0.15); }
  .btn-reset { width: 100%; background: transparent; border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-family: var(--mono); font-size: 11px; padding: 9px; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
  .btn-reset:hover { border-color: var(--muted); color: var(--text); }

  /* RESULTS */
  .results-section { display: none; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .verdict { border-radius: 12px; padding: 18px 22px; margin-bottom: 14px; border: 1px solid; display: flex; align-items: center; gap: 14px; }
  .verdict.accept { background: rgba(10,171,110,0.08); border-color: rgba(10,171,110,0.35); }
  .verdict.reject { background: rgba(217,45,75,0.07); border-color: rgba(217,45,75,0.3); }
  .verdict-icon { font-size: 28px; line-height: 1; }
  .verdict-title { font-family: var(--mono); font-size: 16px; font-weight: 700; }
  .verdict.accept .verdict-title { color: var(--accept); }
  .verdict.reject .verdict-title { color: var(--reject); }
  .verdict-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* METRICS */
  .metrics { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 14px; }
  .metric { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .metric-label { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
  .metric-value { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--text); line-height: 1; }
  .metric-unit { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .metric.highlight .metric-value { color: var(--accent); }
  .metric.highlight2 .metric-value { color: var(--accent2); }

  /* MOTILITY BAR */
  .mot-bar-wrap { margin-bottom: 14px; }
  .mot-bar-title { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
  .mot-bar { display: flex; height: 28px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .mot-seg { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 10px; font-weight: 700; color: white; transition: width 0.4s ease; overflow: hidden; white-space: nowrap; }
  .mot-seg.pr { background: #0070c0; }
  .mot-seg.ps { background: #00a8cc; }
  .mot-seg.np { background: #f59e0b; }
  .mot-seg.im { background: #94a3b8; color: #1a2540; }
  .mot-legend { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-top: 8px; }
  .mot-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text); }
  .mot-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  /* DETAIL TABLE */
  .detail-table { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .dk { color: var(--muted); }
  .detail-row .dv { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--text); }
  .diff-ok { color: var(--accept) !important; }
  .diff-bad { color: var(--reject) !important; }

  /* NOTE */
  .who-note { background: rgba(0,112,192,0.05); border: 1px solid rgba(0,112,192,0.18); border-radius: 8px; padding: 11px 13px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .who-note strong { color: var(--accent); }

  /* ERROR */
  .error-msg { background: rgba(217,95,26,0.1); border: 1px solid rgba(217,95,26,0.3); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--warn); display: none; margin-top: 8px; }

  .oms-ref { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 11px; color: var(--muted); margin-bottom: 14px; line-height: 1.7; }
  .oms-ref strong { color: var(--text); }

  @media (max-width: 480px) {
    .grid-2,.metrics,.mot-grid { grid-template-columns: 1fr; }
    .mot-legend { grid-template-columns: repeat(2,1fr); }
    .counts-row { grid-template-columns: 1fr 1fr; }
  }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;container&quot;&gt;

  &lt;header&gt;
    &lt;span class=&quot;tag&quot;&gt;OMS 6ª edición · Hemocitómetro Neubauer mejorado&lt;/span&gt;
    &lt;h1&gt;Calculadora &lt;span&gt;Análisis Espermático&lt;/span&gt;&lt;/h1&gt;
    &lt;p class=&quot;subtitle&quot;&gt;Concentración · Motilidad · Validación de réplicas · Número total&lt;/p&gt;
  &lt;/header&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;button class=&quot;tab-btn active&quot; onclick=&quot;switchTab(&#x27;conc&#x27;)&quot;&gt;🔬 Concentración&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab(&#x27;mot&#x27;)&quot;&gt;🏃 Motilidad&lt;/button&gt;
  &lt;/div&gt;

  &lt;!-- ══ TAB CONCENTRACIÓN ══ --&gt;
  &lt;div class=&quot;tab-panel active&quot; id=&quot;tab-conc&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;div class=&quot;card-title&quot;&gt;Parámetros del recuento&lt;/div&gt;
      &lt;div class=&quot;grid-2&quot;&gt;
        &lt;div class=&quot;field&quot;&gt;
          &lt;label&gt;Dilución&lt;/label&gt;
          &lt;select id=&quot;dilution&quot;&gt;
            &lt;option value=&quot;2&quot;&gt;1 : 2&lt;/option&gt;
            &lt;option value=&quot;5&quot;&gt;1 : 5&lt;/option&gt;
            &lt;option value=&quot;10&quot; selected&gt;1 : 10&lt;/option&gt;
            &lt;option value=&quot;20&quot;&gt;1 : 20&lt;/option&gt;
            &lt;option value=&quot;50&quot;&gt;1 : 50&lt;/option&gt;
          &lt;/select&gt;
        &lt;/div&gt;
        &lt;div class=&quot;field&quot;&gt;
          &lt;label&gt;Tipo de área&lt;/label&gt;
          &lt;div class=&quot;toggle-group&quot;&gt;
            &lt;button class=&quot;toggle-btn active&quot; id=&quot;btn-squares&quot; onclick=&quot;setAreaType(&#x27;squares&#x27;)&quot;&gt;Cuadrados&lt;br&gt;&lt;small style=&quot;font-size:10px;opacity:0.7&quot;&gt;central&lt;/small&gt;&lt;/button&gt;
            &lt;button class=&quot;toggle-btn&quot; id=&quot;btn-grids&quot; onclick=&quot;setAreaType(&#x27;grids&#x27;)&quot;&gt;Cuadrículas&lt;br&gt;&lt;small style=&quot;font-size:10px;opacity:0.7&quot;&gt;periféricas&lt;/small&gt;&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;field&quot; id=&quot;squares-field&quot;&gt;
          &lt;label&gt;Cuadrados grandes por cámara&lt;/label&gt;
          &lt;select id=&quot;area-count&quot;&gt;
            &lt;option value=&quot;5&quot;&gt;5 cuadrados&lt;/option&gt;
            &lt;option value=&quot;10&quot;&gt;10 cuadrados&lt;/option&gt;
            &lt;option value=&quot;25&quot;&gt;25 cuadrados (completa)&lt;/option&gt;
          &lt;/select&gt;
        &lt;/div&gt;
        &lt;div class=&quot;field&quot; id=&quot;grids-field&quot; style=&quot;display:none;&quot;&gt;
          &lt;label&gt;Cuadrículas periféricas por cámara&lt;/label&gt;
          &lt;select id=&quot;grid-count&quot;&gt;
            &lt;option value=&quot;2&quot;&gt;2&lt;/option&gt;&lt;option value=&quot;3&quot;&gt;3&lt;/option&gt;&lt;option value=&quot;4&quot;&gt;4&lt;/option&gt;
            &lt;option value=&quot;5&quot;&gt;5&lt;/option&gt;&lt;option value=&quot;6&quot;&gt;6&lt;/option&gt;&lt;option value=&quot;7&quot;&gt;7&lt;/option&gt;
            &lt;option value=&quot;8&quot;&gt;8&lt;/option&gt;&lt;option value=&quot;9&quot;&gt;9 (todas)&lt;/option&gt;
          &lt;/select&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div style=&quot;margin-top:14px;&quot;&gt;
        &lt;label&gt;Espermatozoides contados por réplica&lt;/label&gt;
        &lt;div class=&quot;counts-row&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;count-label&quot;&gt;RÉPLICA 1&lt;/div&gt;&lt;input type=&quot;number&quot; id=&quot;count1&quot; placeholder=&quot;ej. 210&quot; min=&quot;0&quot;&gt;&lt;/div&gt;
          &lt;div&gt;&lt;div class=&quot;count-label&quot;&gt;RÉPLICA 2&lt;/div&gt;&lt;input type=&quot;number&quot; id=&quot;count2&quot; placeholder=&quot;ej. 215&quot; min=&quot;0&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div style=&quot;margin-top:14px;&quot;&gt;
        &lt;label&gt;Volumen del eyaculado &lt;span style=&quot;font-weight:300;&quot;&gt;(opcional — para número total)&lt;/span&gt;&lt;/label&gt;
        &lt;div style=&quot;display:flex;align-items:center;gap:10px;margin-top:4px;&quot;&gt;
          &lt;input type=&quot;number&quot; id=&quot;volume&quot; placeholder=&quot;ej. 3.5&quot; step=&quot;0.1&quot; min=&quot;0&quot; style=&quot;flex:1;&quot;&gt;
          &lt;span style=&quot;font-family:var(--mono);font-size:12px;color:var(--muted);&quot;&gt;ml&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;error-msg&quot; id=&quot;conc-error&quot;&gt;&lt;/div&gt;
      &lt;button class=&quot;btn-calc&quot; onclick=&quot;calcConc()&quot;&gt;▶ CALCULAR CONCENTRACIÓN&lt;/button&gt;
      &lt;button class=&quot;btn-reset&quot; onclick=&quot;resetConc()&quot;&gt;↺ Reiniciar&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;results-section&quot; id=&quot;conc-results&quot;&gt;
      &lt;div class=&quot;verdict&quot; id=&quot;conc-verdict&quot;&gt;
        &lt;div class=&quot;verdict-icon&quot; id=&quot;conc-vicon&quot;&gt;&lt;/div&gt;
        &lt;div&gt;&lt;div class=&quot;verdict-title&quot; id=&quot;conc-vtitle&quot;&gt;&lt;/div&gt;&lt;div class=&quot;verdict-sub&quot; id=&quot;conc-vsub&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;metrics&quot;&gt;
        &lt;div class=&quot;metric highlight&quot;&gt;&lt;div class=&quot;metric-label&quot;&gt;Concentración&lt;/div&gt;&lt;div class=&quot;metric-value&quot; id=&quot;r-conc&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;metric-unit&quot;&gt;× 10⁶ esp/ml&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;metric-label&quot;&gt;Incertidumbre&lt;/div&gt;&lt;div class=&quot;metric-value&quot; id=&quot;r-error&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;metric-unit&quot;&gt;error estimado&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;metric highlight2&quot; id=&quot;metric-total&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;metric-label&quot;&gt;Total por eyaculado&lt;/div&gt;&lt;div class=&quot;metric-value&quot; id=&quot;r-total&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;metric-unit&quot;&gt;× 10⁶ espermatozoides&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;metric-label&quot;&gt;Factor corrección&lt;/div&gt;&lt;div class=&quot;metric-value&quot; id=&quot;r-factor&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;metric-unit&quot;&gt;Tabla 2.4 OMS&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;detail-table&quot;&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;Dilución&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;d-dil&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;Área contada&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;d-area&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;Réplica 1&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;d-r1&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;Réplica 2&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;d-r2&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;Suma&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;d-sum&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;Diferencia&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;d-diff&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;Límite aceptable (Tabla 2.3)&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;d-lim&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;who-note&quot; id=&quot;conc-note&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ══ TAB MOTILIDAD ══ --&gt;
  &lt;div class=&quot;tab-panel&quot; id=&quot;tab-mot&quot;&gt;
    &lt;div class=&quot;oms-ref&quot;&gt;
      &lt;strong&gt;Categorías OMS 6ª ed.:&lt;/strong&gt; PR rápido ≥25 µm/s · PR lento 5–24 µm/s · No progresivo &amp;lt;5 µm/s · Inmóvil.&lt;br&gt;
      Ingresar número de espermatozoides (no %) de cada categoría. Mínimo 200 por réplica. Cada réplica = preparación húmeda nueva.
    &lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;
      &lt;div class=&quot;card-title&quot;&gt;Réplica 1 — Primera preparación húmeda&lt;/div&gt;
      &lt;div class=&quot;mot-grid&quot;&gt;
        &lt;div class=&quot;mot-field cat-pr&quot;&gt;&lt;div class=&quot;mot-field-label&quot; style=&quot;color:#0070c0;&quot;&gt;Progresivo Rápido&lt;/div&gt;&lt;div class=&quot;mot-field-sub&quot;&gt;≥ 25 µm/s&lt;/div&gt;&lt;input type=&quot;number&quot; id=&quot;m1-pr&quot; placeholder=&quot;0&quot; min=&quot;0&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;mot-field cat-ps&quot;&gt;&lt;div class=&quot;mot-field-label&quot; style=&quot;color:#00a8cc;&quot;&gt;Progresivo Lento&lt;/div&gt;&lt;div class=&quot;mot-field-sub&quot;&gt;5–24 µm/s&lt;/div&gt;&lt;input type=&quot;number&quot; id=&quot;m1-ps&quot; placeholder=&quot;0&quot; min=&quot;0&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;mot-field cat-np&quot;&gt;&lt;div class=&quot;mot-field-label&quot; style=&quot;color:#d97706;&quot;&gt;No Progresivo&lt;/div&gt;&lt;div class=&quot;mot-field-sub&quot;&gt;&amp;lt; 5 µm/s&lt;/div&gt;&lt;input type=&quot;number&quot; id=&quot;m1-np&quot; placeholder=&quot;0&quot; min=&quot;0&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;mot-field cat-im&quot;&gt;&lt;div class=&quot;mot-field-label&quot; style=&quot;color:#64748b;&quot;&gt;Inmóvil&lt;/div&gt;&lt;div class=&quot;mot-field-sub&quot;&gt;Sin movimiento&lt;/div&gt;&lt;input type=&quot;number&quot; id=&quot;m1-im&quot; placeholder=&quot;0&quot; min=&quot;0&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div style=&quot;margin-top:10px;font-size:12px;color:var(--muted);&quot;&gt;Total réplica 1: &lt;strong id=&quot;mot-total1&quot; style=&quot;color:var(--text);&quot;&gt;0&lt;/strong&gt; espermatozoides&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;
      &lt;div class=&quot;card-title&quot;&gt;Réplica 2 — Segunda preparación húmeda&lt;/div&gt;
      &lt;div class=&quot;mot-grid&quot;&gt;
        &lt;div class=&quot;mot-field cat-pr&quot;&gt;&lt;div class=&quot;mot-field-label&quot; style=&quot;color:#0070c0;&quot;&gt;Progresivo Rápido&lt;/div&gt;&lt;div class=&quot;mot-field-sub&quot;&gt;≥ 25 µm/s&lt;/div&gt;&lt;input type=&quot;number&quot; id=&quot;m2-pr&quot; placeholder=&quot;0&quot; min=&quot;0&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;mot-field cat-ps&quot;&gt;&lt;div class=&quot;mot-field-label&quot; style=&quot;color:#00a8cc;&quot;&gt;Progresivo Lento&lt;/div&gt;&lt;div class=&quot;mot-field-sub&quot;&gt;5–24 µm/s&lt;/div&gt;&lt;input type=&quot;number&quot; id=&quot;m2-ps&quot; placeholder=&quot;0&quot; min=&quot;0&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;mot-field cat-np&quot;&gt;&lt;div class=&quot;mot-field-label&quot; style=&quot;color:#d97706;&quot;&gt;No Progresivo&lt;/div&gt;&lt;div class=&quot;mot-field-sub&quot;&gt;&amp;lt; 5 µm/s&lt;/div&gt;&lt;input type=&quot;number&quot; id=&quot;m2-np&quot; placeholder=&quot;0&quot; min=&quot;0&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;mot-field cat-im&quot;&gt;&lt;div class=&quot;mot-field-label&quot; style=&quot;color:#64748b;&quot;&gt;Inmóvil&lt;/div&gt;&lt;div class=&quot;mot-field-sub&quot;&gt;Sin movimiento&lt;/div&gt;&lt;input type=&quot;number&quot; id=&quot;m2-im&quot; placeholder=&quot;0&quot; min=&quot;0&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div style=&quot;margin-top:10px;font-size:12px;color:var(--muted);&quot;&gt;Total réplica 2: &lt;strong id=&quot;mot-total2&quot; style=&quot;color:var(--text);&quot;&gt;0&lt;/strong&gt; espermatozoides&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;error-msg&quot; id=&quot;mot-error&quot;&gt;&lt;/div&gt;
    &lt;button class=&quot;btn-calc&quot; onclick=&quot;calcMot()&quot;&gt;▶ CALCULAR MOTILIDAD&lt;/button&gt;
    &lt;button class=&quot;btn-reset&quot; onclick=&quot;resetMot()&quot;&gt;↺ Reiniciar&lt;/button&gt;

    &lt;div class=&quot;results-section&quot; id=&quot;mot-results&quot;&gt;
      &lt;div class=&quot;verdict&quot; id=&quot;mot-verdict&quot;&gt;
        &lt;div class=&quot;verdict-icon&quot; id=&quot;mot-vicon&quot;&gt;&lt;/div&gt;
        &lt;div&gt;&lt;div class=&quot;verdict-title&quot; id=&quot;mot-vtitle&quot;&gt;&lt;/div&gt;&lt;div class=&quot;verdict-sub&quot; id=&quot;mot-vsub&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;mot-bar-wrap&quot;&gt;
        &lt;div class=&quot;mot-bar-title&quot;&gt;Distribución de motilidad (% promedio)&lt;/div&gt;
        &lt;div class=&quot;mot-bar&quot;&gt;
          &lt;div class=&quot;mot-seg pr&quot; id=&quot;bar-pr&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;mot-seg ps&quot; id=&quot;bar-ps&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;mot-seg np&quot; id=&quot;bar-np&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;mot-seg im&quot; id=&quot;bar-im&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;mot-legend&quot;&gt;
          &lt;div class=&quot;mot-legend-item&quot;&gt;&lt;div class=&quot;mot-legend-dot&quot; style=&quot;background:#0070c0;&quot;&gt;&lt;/div&gt;&lt;span id=&quot;leg-pr&quot;&gt;PR rápido&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;mot-legend-item&quot;&gt;&lt;div class=&quot;mot-legend-dot&quot; style=&quot;background:#00a8cc;&quot;&gt;&lt;/div&gt;&lt;span id=&quot;leg-ps&quot;&gt;PR lento&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;mot-legend-item&quot;&gt;&lt;div class=&quot;mot-legend-dot&quot; style=&quot;background:#f59e0b;&quot;&gt;&lt;/div&gt;&lt;span id=&quot;leg-np&quot;&gt;No prog.&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;mot-legend-item&quot;&gt;&lt;div class=&quot;mot-legend-dot&quot; style=&quot;background:#94a3b8;&quot;&gt;&lt;/div&gt;&lt;span id=&quot;leg-im&quot;&gt;Inmóvil&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;metrics&quot;&gt;
        &lt;div class=&quot;metric highlight&quot;&gt;&lt;div class=&quot;metric-label&quot;&gt;Motilidad progresiva&lt;/div&gt;&lt;div class=&quot;metric-value&quot; id=&quot;r-prog&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;metric-unit&quot;&gt;PR rápido + lento · ref OMS ≥ 32%&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;metric-label&quot;&gt;Motilidad total&lt;/div&gt;&lt;div class=&quot;metric-value&quot; id=&quot;r-mot-total&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;metric-unit&quot;&gt;PR + NP · ref OMS ≥ 40%&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;metric-label&quot;&gt;Inmóviles&lt;/div&gt;&lt;div class=&quot;metric-value&quot; id=&quot;r-imm&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;metric-unit&quot;&gt;% del total&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;metric&quot;&gt;&lt;div class=&quot;metric-label&quot;&gt;Diferencia / Límite&lt;/div&gt;&lt;div class=&quot;metric-value&quot; id=&quot;r-mot-diff&quot;&gt;—&lt;/div&gt;&lt;div class=&quot;metric-unit&quot;&gt;grupo dominante (Tabla 2.2)&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;detail-table&quot;&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;PR rápido promedio&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;dm-pr&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;PR lento promedio&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;dm-ps&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;No progresivo promedio&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;dm-np&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;Inmóvil promedio&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;dm-im&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;Grupo dominante&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;dm-dom&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;Diferencia réplicas&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;dm-diff&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;detail-row&quot;&gt;&lt;span class=&quot;dk&quot;&gt;Límite aceptable (Tabla 2.2)&lt;/span&gt;&lt;span class=&quot;dv&quot; id=&quot;dm-lim&quot;&gt;—&lt;/span&gt;&lt;/div&gt;

&lt;script&gt;
const TABLE_2_3=[

  [846,875,57,3.4],[817,845,56,3.5],[788,816,55,3.6],[760,787,54,3.6],
  [732,759,53,3.7],[704,731,52,3.8],[678,703,51,3.8],[651,677,50,3.9],
  [625,650,49,4.0],[600,624,48,4.1],[576,599,47,4.2],[551,575,46,4.3],
  [528,550,45,4.4],[504,527,44,4.5],[482,503,43,4.6],[460,481,42,4.7],
  [438,459,41,4.8],[417,437,40,4.9],[396,416,39,5.0],[376,395,38,5.2],
  [357,375,37,5.3],[338,356,36,5.4],[319,337,35,5.6],[301,318,34,5.8],

  [219,234,29,6.8],[206,218,28,7.0],[190,205,27,7.3],[176,189,26,7.5],
  [163,175,25,7.8],[150,162,24,8.2],[138,149,23,8.5],[126,137,22,8.9],
  [115,125,21,9.3],[105,114,20,9.8],[94,104,19,10.3],[85,93,18,10.8],

  [44,51,13,15.1],[38,43,12,16.2],[32,37,11,17.7],[27,31,10,19.2],
  [22,26,9,21.3],[17,21,8,24.3],[13,16,7,27.7],[10,12,6,31.6],
  [7,9,5,37.8],[5,6,4,44.7],[3,4,3,57.7],[2,2,2,70.7],[1,1,1,100.0]

const TABLE_2_2=[
  [1,1,2],[2,3,3],[4,6,4],[7,9,5],[10,13,6],[14,19,7],[20,27,8],
  [28,44,9],[45,55,10],[56,72,9],[73,80,8],[81,86,7],[87,90,6],
  [91,93,5],[94,96,4],[97,98,3],[99,99,2]
];

const TABLE_2_4={
  2:{sq:{5:20,10:40,25:100},gr:{2:200,3:300,4:400,5:500,6:600,7:700,8:800,9:900}},
  5:{sq:{5:8,10:16,25:40},gr:{2:80,3:120,4:160,5:200,6:240,7:280,8:320,9:360}},
  10:{sq:{5:4,10:8,25:20},gr:{2:40,3:60,4:80,5:100,6:120,7:140,8:160,9:180}},
  20:{sq:{5:2,10:4,25:10},gr:{2:20,3:30,4:40,5:50,6:60,7:70,8:80,9:90}},
  50:{sq:{5:0.8,10:1.6,25:4},gr:{2:8,3:12,4:16,5:20,6:24,7:28,8:32,9:36}}
};

let areaType=&#x27;squares&#x27;;

function switchTab(tab){
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach((b,i)=&gt;b.classList.toggle(&#x27;active&#x27;,(i===0&amp;&amp;tab===&#x27;conc&#x27;)||(i===1&amp;&amp;tab===&#x27;mot&#x27;)));
  document.getElementById(&#x27;tab-conc&#x27;).classList.toggle(&#x27;active&#x27;,tab===&#x27;conc&#x27;);
  document.getElementById(&#x27;tab-mot&#x27;).classList.toggle(&#x27;active&#x27;,tab===&#x27;mot&#x27;);
}

function setAreaType(type){
  areaType=type;
  document.getElementById(&#x27;btn-squares&#x27;).classList.toggle(&#x27;active&#x27;,type===&#x27;squares&#x27;);
  document.getElementById(&#x27;btn-grids&#x27;).classList.toggle(&#x27;active&#x27;,type===&#x27;grids&#x27;);
  document.getElementById(&#x27;squares-field&#x27;).style.display=type===&#x27;squares&#x27;?&#x27;&#x27;:&#x27;none&#x27;;
  document.getElementById(&#x27;grids-field&#x27;).style.display=type===&#x27;grids&#x27;?&#x27;&#x27;:&#x27;none&#x27;;
}

function lookupT23(sum){for(const r of TABLE_2_3)if(sum&gt;=r[0]&amp;&amp;sum&lt;=r[1])return{limit:r[2],error:r[3]};return null;}
function lookupT22(avg){const a=Math.round(avg);for(const r of TABLE_2_2)if(a&gt;=r[0]&amp;&amp;a&lt;=r[1])return r[2];return null;}
function showErr(id,msg){const e=document.getElementById(id);e.textContent=msg;e.style.display=&#x27;block&#x27;;}
function hideErr(id){document.getElementById(id).style.display=&#x27;none&#x27;;}
function fmtConc(v){return v&lt;0.1?v.toFixed(3):v&lt;10?v.toFixed(2):(Math.round(v*10)/10).toString();}

function calcConc(){
  hideErr(&#x27;conc-error&#x27;);
  document.getElementById(&#x27;conc-results&#x27;).style.display=&#x27;none&#x27;;
  const c1=parseFloat(document.getElementById(&#x27;count1&#x27;).value);
  const c2=parseFloat(document.getElementById(&#x27;count2&#x27;).value);
  const dil=parseInt(document.getElementById(&#x27;dilution&#x27;).value);
  const vol=parseFloat(document.getElementById(&#x27;volume&#x27;).value);
  if(isNaN(c1)||isNaN(c2)||c1&lt;0||c2&lt;0){showErr(&#x27;conc-error&#x27;,&#x27;Ingresa los conteos de ambas réplicas.&#x27;);return;}
  const aKey=areaType===&#x27;squares&#x27;?parseInt(document.getElementById(&#x27;area-count&#x27;).value):parseInt(document.getElementById(&#x27;grid-count&#x27;).value);
  const factor=areaType===&#x27;squares&#x27;?TABLE_2_4[dil].sq[aKey]:TABLE_2_4[dil].gr[aKey];
  if(!factor){showErr(&#x27;conc-error&#x27;,&#x27;Combinación no válida en Tabla 2.4.&#x27;);return;}
  const sum=c1+c2,diff=Math.abs(c1-c2);
  const lk=lookupT23(sum);
  if(!lk){showErr(&#x27;conc-error&#x27;,&#x27;Suma fuera de rango Tabla 2.3 (1–1000).&#x27;);return;}
  const ok=diff&lt;=lk.limit;
  const concM6=sum/factor;
  const totalM6=(!isNaN(vol)&amp;&amp;vol&gt;0)?concM6*vol:null;
  const aLbl=areaType===&#x27;squares&#x27;?`${aKey} cuadrados grandes`:`${aKey} cuadrículas periféricas`;
  const vb=document.getElementById(&#x27;conc-verdict&#x27;);
  vb.className=&#x27;verdict &#x27;+(ok?&#x27;accept&#x27;:&#x27;reject&#x27;);
  document.getElementById(&#x27;conc-vicon&#x27;).textContent=ok?&#x27;✓&#x27;:&#x27;✗&#x27;;
  document.getElementById(&#x27;conc-vtitle&#x27;).textContent=ok?&#x27;CONTEO ACEPTADO&#x27;:&#x27;CONTEO RECHAZADO&#x27;;
  document.getElementById(&#x27;conc-vsub&#x27;).textContent=ok?`Diferencia ${diff} ≤ límite ${lk.limit} → réplicas concordantes`:`Diferencia ${diff} &gt; límite ${lk.limit} → preparar nuevas diluciones`;
  document.getElementById(&#x27;r-conc&#x27;).textContent=ok?fmtConc(concM6):&#x27;—&#x27;;
  document.getElementById(&#x27;r-error&#x27;).textContent=lk.error.toFixed(1)+&#x27;%&#x27;;
  document.getElementById(&#x27;r-factor&#x27;).textContent=factor;
  const mt=document.getElementById(&#x27;metric-total&#x27;);
  if(ok&amp;&amp;totalM6!==null){mt.style.display=&#x27;&#x27;;document.getElementById(&#x27;r-total&#x27;).textContent=totalM6&lt;10?totalM6.toFixed(1):Math.round(totalM6);}
  else mt.style.display=&#x27;none&#x27;;
  document.getElementById(&#x27;d-dil&#x27;).textContent=`1 : ${dil}`;
  document.getElementById(&#x27;d-area&#x27;).textContent=aLbl;
  document.getElementById(&#x27;d-r1&#x27;).textContent=c1;
  document.getElementById(&#x27;d-r2&#x27;).textContent=c2;
  document.getElementById(&#x27;d-sum&#x27;).textContent=sum;
  const de=document.getElementById(&#x27;d-diff&#x27;);de.textContent=diff;de.className=&#x27;dv &#x27;+(ok?&#x27;diff-ok&#x27;:&#x27;diff-bad&#x27;);
  document.getElementById(&#x27;d-lim&#x27;).textContent=lk.limit;
  let note=`&lt;strong&gt;Tabla 2.3&lt;/strong&gt;: suma ${sum} → límite &lt;strong&gt;${lk.limit}&lt;/strong&gt; (IC 95%). Error estimado: &lt;strong&gt;${lk.error}%&lt;/strong&gt;. `;
  note+=ok?`Factor ${factor} · dilución 1:${dil} · ${aLbl}.${totalM6?` Total = ${fmtConc(concM6)} × ${vol} ml.`:&#x27;&#x27;}`:
    `Repetir hasta 2 veces más; si persiste, reportar promedio con nota de alta variabilidad.`;
  document.getElementById(&#x27;conc-note&#x27;).innerHTML=note;
  document.getElementById(&#x27;conc-results&#x27;).style.display=&#x27;block&#x27;;
  document.getElementById(&#x27;conc-results&#x27;).scrollIntoView({behavior:&#x27;smooth&#x27;,block:&#x27;nearest&#x27;});
}

function resetConc(){
  [&#x27;count1&#x27;,&#x27;count2&#x27;,&#x27;volume&#x27;].forEach(id=&gt;document.getElementById(id).value=&#x27;&#x27;);
  document.getElementById(&#x27;dilution&#x27;).value=&#x27;10&#x27;;
  document.getElementById(&#x27;area-count&#x27;).value=&#x27;5&#x27;;
  setAreaType(&#x27;squares&#x27;);
  hideErr(&#x27;conc-error&#x27;);
  document.getElementById(&#x27;conc-results&#x27;).style.display=&#x27;none&#x27;;
}

function gv(id){return parseFloat(document.getElementById(id).value)||0;}

function updateTotal(rep){
  document.getElementById(`mot-total${rep}`).textContent=gv(`m${rep}-pr`)+gv(`m${rep}-ps`)+gv(`m${rep}-np`)+gv(`m${rep}-im`);
}

[&#x27;pr&#x27;,&#x27;ps&#x27;,&#x27;np&#x27;,&#x27;im&#x27;].forEach(c=&gt;[1,2].forEach(r=&gt;{
  const el=document.getElementById(`m${r}-${c}`);
  if(el)el.addEventListener(&#x27;input&#x27;,()=&gt;updateTotal(r));
}));

function calcMot(){
  hideErr(&#x27;mot-error&#x27;);
  document.getElementById(&#x27;mot-results&#x27;).style.display=&#x27;none&#x27;;
  const r1={pr:gv(&#x27;m1-pr&#x27;),ps:gv(&#x27;m1-ps&#x27;),np:gv(&#x27;m1-np&#x27;),im:gv(&#x27;m1-im&#x27;)};
  const r2={pr:gv(&#x27;m2-pr&#x27;),ps:gv(&#x27;m2-ps&#x27;),np:gv(&#x27;m2-np&#x27;),im:gv(&#x27;m2-im&#x27;)};
  const t1=r1.pr+r1.ps+r1.np+r1.im,t2=r2.pr+r2.ps+r2.np+r2.im;
  if(t1&lt;1||t2&lt;1){showErr(&#x27;mot-error&#x27;,&#x27;Ingresa los conteos de ambas réplicas.&#x27;);return;}
  if(t1&lt;200||t2&lt;200){showErr(&#x27;mot-error&#x27;,`Advertencia: réplica ${t1&lt;200?1:2} con ${t1&lt;200?t1:t2} esp — se recomiendan ≥200. Puedes continuar.`);}
  const p1={pr:r1.pr/t1*100,ps:r1.ps/t1*100,np:r1.np/t1*100,im:r1.im/t1*100};
  const p2={pr:r2.pr/t2*100,ps:r2.ps/t2*100,np:r2.np/t2*100,im:r2.im/t2*100};
  const avg={pr:(p1.pr+p2.pr)/2,ps:(p1.ps+p2.ps)/2,np:(p1.np+p2.np)/2,im:(p1.im+p2.im)/2};
  const motPct=avg.pr+avg.ps+avg.np,immPct=avg.im;
  const domIsImm=immPct&gt;motPct;
  const domAvg=domIsImm?immPct:motPct;
  const domDiff=domIsImm?Math.abs(p1.im-p2.im):Math.abs((p1.pr+p1.ps+p1.np)-(p2.pr+p2.ps+p2.np));
  const lim=lookupT22(domAvg);
  const ok=lim!==null&amp;&amp;domDiff&lt;=lim;
  let rnd={pr:Math.round(avg.pr),ps:Math.round(avg.ps),np:Math.round(avg.np),im:Math.round(avg.im)};
  const s=rnd.pr+rnd.ps+rnd.np+rnd.im;
  if(s===99){domIsImm?rnd.im++:rnd.pr++;}
  if(s===101){domIsImm?rnd.im--:rnd.pr--;}
  const progPct=rnd.pr+rnd.ps,totMotPct=progPct+rnd.np;
  const vb=document.getElementById(&#x27;mot-verdict&#x27;);
  vb.className=&#x27;verdict &#x27;+(ok?&#x27;accept&#x27;:&#x27;reject&#x27;);
  document.getElementById(&#x27;mot-vicon&#x27;).textContent=ok?&#x27;✓&#x27;:&#x27;✗&#x27;;
  document.getElementById(&#x27;mot-vtitle&#x27;).textContent=ok?&#x27;MOTILIDAD ACEPTADA&#x27;:&#x27;MOTILIDAD RECHAZADA&#x27;;
  document.getElementById(&#x27;mot-vsub&#x27;).textContent=ok?`Diferencia ${domDiff.toFixed(1)}% ≤ límite ${lim}% → réplicas concordantes`:`Diferencia ${domDiff.toFixed(1)}% &gt; límite ${lim??&#x27;—&#x27;}% → repetir con nuevas preparaciones`;
  [&#x27;pr&#x27;,&#x27;ps&#x27;,&#x27;np&#x27;,&#x27;im&#x27;].forEach(c=&gt;{
    const seg=document.getElementById(`bar-${c}`);
    seg.style.width=rnd[c]+&#x27;%&#x27;;
    seg.textContent=rnd[c]&gt;5?rnd[c]+&#x27;%&#x27;:&#x27;&#x27;;
  });
  document.getElementById(&#x27;leg-pr&#x27;).textContent=`PR rápido ${rnd.pr}%`;
  document.getElementById(&#x27;leg-ps&#x27;).textContent=`PR lento ${rnd.ps}%`;
  document.getElementById(&#x27;leg-np&#x27;).textContent=`No prog. ${rnd.np}%`;
  document.getElementById(&#x27;leg-im&#x27;).textContent=`Inmóvil ${rnd.im}%`;
  const pe=document.getElementById(&#x27;r-prog&#x27;);pe.textContent=progPct+&#x27;%&#x27;;pe.style.color=progPct&gt;=32?&#x27;var(--accept)&#x27;:&#x27;var(--reject)&#x27;;
  const te=document.getElementById(&#x27;r-mot-total&#x27;);te.textContent=totMotPct+&#x27;%&#x27;;te.style.color=totMotPct&gt;=40?&#x27;var(--accept)&#x27;:&#x27;var(--reject)&#x27;;
  document.getElementById(&#x27;r-imm&#x27;).textContent=rnd.im+&#x27;%&#x27;;
  document.getElementById(&#x27;r-mot-diff&#x27;).textContent=`${domDiff.toFixed(1)}% / lím ${lim??&#x27;—&#x27;}%`;
  document.getElementById(&#x27;dm-pr&#x27;).textContent=rnd.pr+&#x27;%&#x27;;
  document.getElementById(&#x27;dm-ps&#x27;).textContent=rnd.ps+&#x27;%&#x27;;
  document.getElementById(&#x27;dm-np&#x27;).textContent=rnd.np+&#x27;%&#x27;;
  document.getElementById(&#x27;dm-im&#x27;).textContent=rnd.im+&#x27;%&#x27;;
  document.getElementById(&#x27;dm-dom&#x27;).textContent=(domIsImm?&#x27;Inmóvil&#x27;:&#x27;Mótil&#x27;)+` (${domAvg.toFixed(1)}% promedio)`;
  const dd=document.getElementById(&#x27;dm-diff&#x27;);dd.textContent=domDiff.toFixed(1)+&#x27;%&#x27;;dd.className=&#x27;dv &#x27;+(ok?&#x27;diff-ok&#x27;:&#x27;diff-bad&#x27;);
  document.getElementById(&#x27;dm-lim&#x27;).textContent=lim?lim+&#x27;%&#x27;:&#x27;—&#x27;;
  let note=`&lt;strong&gt;Tabla 2.2&lt;/strong&gt;: grupo dominante &quot;${domIsImm?&#x27;inmóvil&#x27;:&#x27;mótil&#x27;}&quot; ${domAvg.toFixed(1)}% → límite &lt;strong&gt;${lim??&#x27;—&#x27;}%&lt;/strong&gt;. `;
  note+=`&lt;strong&gt;Motilidad progresiva (PR)&lt;/strong&gt;: ${progPct}% `;
  note+=progPct&gt;=32?`✓ ≥ 32% (ref. OMS). `:`✗ &amp;lt; 32% (ref. OMS). `;
  note+=`&lt;strong&gt;Motilidad total&lt;/strong&gt;: ${totMotPct}% `;
  note+=totMotPct&gt;=40?`✓ ≥ 40% (ref. OMS).`:`✗ &amp;lt; 40% (ref. OMS).`;
  if(!ok)note+=` Repetir hasta 2 veces más; si persiste, reportar promedio de 6 evaluaciones.`;
  document.getElementById(&#x27;mot-note&#x27;).innerHTML=note;
  document.getElementById(&#x27;mot-results&#x27;).style.display=&#x27;block&#x27;;
  document.getElementById(&#x27;mot-results&#x27;).scrollIntoView({behavior:&#x27;smooth&#x27;,block:&#x27;nearest&#x27;});
}

function resetMot(){
  [&#x27;m1-pr&#x27;,&#x27;m1-ps&#x27;,&#x27;m1-np&#x27;,&#x27;m1-im&#x27;,&#x27;m2-pr&#x27;,&#x27;m2-ps&#x27;,&#x27;m2-np&#x27;,&#x27;m2-im&#x27;].forEach(id=&gt;document.getElementById(id).value=&#x27;&#x27;);
  [&#x27;mot-total1&#x27;,&#x27;mot-total2&#x27;].forEach(id=&gt;document.getElementById(id).textContent=&#x27;0&#x27;);
  hideErr(&#x27;mot-error&#x27;);
  document.getElementById(&#x27;mot-results&#x27;).style.display=&#x27;none&#x27;;
}
