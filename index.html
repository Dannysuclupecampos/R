&lt;script&gt;
const meses = [&#x27;ene&#x27;,&#x27;feb&#x27;,&#x27;mar&#x27;,&#x27;abr&#x27;,&#x27;may&#x27;,&#x27;jun&#x27;,&#x27;jul&#x27;,&#x27;ago&#x27;,&#x27;sep&#x27;,&#x27;oct&#x27;,&#x27;nov&#x27;,&#x27;dic&#x27;];
const mesesFull = [&#x27;enero&#x27;,&#x27;febrero&#x27;,&#x27;marzo&#x27;,&#x27;abril&#x27;,&#x27;mayo&#x27;,&#x27;junio&#x27;,&#x27;julio&#x27;,&#x27;agosto&#x27;,&#x27;septiembre&#x27;,&#x27;octubre&#x27;,&#x27;noviembre&#x27;,&#x27;diciembre&#x27;];

function fmt(d) {
  return `${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtFull(d) {
  return `${d.getDate()} de ${mesesFull[d.getMonth()]} de ${d.getFullYear()}`;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function diffDays(a, b) {
  return Math.floor((b - a) / 86400000);
}

function calcular() {
  const furVal = document.getElementById(&#x27;fur&#x27;).value;
  const cicloLen = parseInt(document.getElementById(&#x27;ciclo&#x27;).value) || 28;
  const relacionVal = document.getElementById(&#x27;relacion&#x27;).value;

  if (!furVal) { alert(&#x27;Por favor ingresa la fecha de última regla.&#x27;); return; }

  const fur = new Date(furVal + &#x27;T00:00:00&#x27;);
  const hoy = new Date();
  hoy.setHours(0,0,0,0);

  const totalDias = diffDays(fur, hoy);
  const semanas = Math.floor(totalDias / 7);
  const diasExtra = totalDias % 7;

  // Ovulación
  const diaOvul = cicloLen - 14;
  const ovulacion = addDays(fur, diaOvul);
  // Fecundación ≈ ovulación
  const fecundacion = ovulacion;
  // Implantación ≈ 8-9 días post-fecundación
  const implantacion = addDays(fecundacion, 9);
  // β-hCG detectable ≈ 2 días después
  const inicioHcg = addDays(implantacion, 2);
  // Edad embrionaria
  const diasEmbrionarios = diffDays(fecundacion, hoy);
  const semEmb = Math.floor(diasEmbrionarios / 7);
  const diasEmb = diasEmbrionarios % 7;

  // FPP (Naegele adaptado)
  const fpp = addDays(fur, 280 + (cicloLen - 28));

  // Resultado principal
  document.getElementById(&#x27;r-semanas&#x27;).textContent = `${semanas} sem`;
  document.getElementById(&#x27;r-dias-extra&#x27;).textContent = diasExtra &gt; 0 ? `${diasExtra} día${diasExtra &gt; 1 ? &#x27;s&#x27; : &#x27;&#x27;} adicional${diasExtra &gt; 1 ? &#x27;es&#x27; : &#x27;&#x27;}` : &#x27;&#x27;;
  document.getElementById(&#x27;r-fpp&#x27;).innerHTML = `Fecha probable de parto: &lt;strong&gt;${fmtFull(fpp)}&lt;/strong&gt;`;

  document.getElementById(&#x27;r-ovulacion&#x27;).textContent = fmt(ovulacion);
  document.getElementById(&#x27;r-dia-ovul&#x27;).textContent = diaOvul;
  document.getElementById(&#x27;r-implantacion&#x27;).textContent = fmt(implantacion);
  document.getElementById(&#x27;r-inicio-hcg&#x27;).textContent = fmt(inicioHcg);
  document.getElementById(&#x27;r-ciclo-len&#x27;).textContent = cicloLen;

  if (diasEmbrionarios &gt;= 0) {
    document.getElementById(&#x27;r-edad-embrionaria&#x27;).textContent = `${semEmb} sem ${diasEmb} d`;
  } else {
    document.getElementById(&#x27;r-edad-embrionaria&#x27;).textContent = &#x27;Aún no concebido&#x27;;
  }

  // Ventana fértil chips
  const inicioFertil = diaOvul - 4; // 4 días antes
  const finFertil = diaOvul + 1;    // 1 día después
  const chipsContainer = document.getElementById(&#x27;r-days-chips&#x27;);
  chipsContainer.innerHTML = &#x27;&#x27;;
  for (let i = 1; i &lt;= cicloLen; i++) {
    const chip = document.createElement(&#x27;span&#x27;);
    chip.className = &#x27;day-chip&#x27;;
    const fecha = addDays(fur, i - 1);
    chip.title = fmt(fecha);
    if (i === diaOvul) {
      chip.className = &#x27;day-chip ovulation&#x27;;
      chip.textContent = `D${i} 🥚`;
    } else if (i &gt;= inicioFertil &amp;&amp; i &lt;= finFertil) {
      chip.className = &#x27;day-chip fertile&#x27;;
      chip.textContent = `D${i}`;
    } else {
      chip.textContent = `D${i}`;
    }
    chipsContainer.appendChild(chip);
  }

  // Nota ventana fértil con fechas
  const inicioFertilDate = addDays(fur, inicioFertil - 1);
  const finFertilDate = addDays(fur, finFertil - 1);
  document.getElementById(&#x27;r-nota-relacion&#x27;).textContent =
    `Ventana fértil: del ${fmt(inicioFertilDate)} al ${fmt(finFertilDate)}. Ovulación estimada: ${fmt(ovulacion)}.`;

  // Evaluación relación sexual
  if (relacionVal) {
    const relacion = new Date(relacionVal + &#x27;T00:00:00&#x27;);
    const diffRel = diffDays(fur, relacion);
    const diaRelCiclo = diffRel + 1;
    let evalText = &#x27;&#x27;;
    let prob = &#x27;&#x27;;

    if (diaRelCiclo &lt; inicioFertil) {
      evalText = `La relación ocurrió el día ${diaRelCiclo} del ciclo (${fmt(relacion)}), antes del inicio de la ventana fértil (día ${inicioFertil}). Quedan ${inicioFertil - diaRelCiclo} días para el comienzo del período fértil.`;
      prob = &#x27;⚠️ Probabilidad de concepción: &lt;strong style=&quot;color:#c8687a&quot;&gt;muy baja&lt;/strong&gt; — fuera de ventana fértil.&#x27;;
    } else if (diaRelCiclo === inicioFertil) {
      evalText = `La relación ocurrió el día ${diaRelCiclo} del ciclo (${fmt(relacion)}), justo al inicio de la ventana fértil.`;
      prob = &#x27;🟡 Probabilidad de concepción: &lt;strong style=&quot;color:#c9975a&quot;&gt;posible&lt;/strong&gt; — inicio de ventana fértil.&#x27;;
    } else if (diaRelCiclo &gt;= inicioFertil + 1 &amp;&amp; diaRelCiclo &lt; diaOvul) {
      evalText = `La relación ocurrió el día ${diaRelCiclo} del ciclo (${fmt(relacion)}), dentro de la ventana fértil, ${diaOvul - diaRelCiclo} día(s) antes de la ovulación estimada.`;
      prob = &#x27;🟢 Probabilidad de concepción: &lt;strong style=&quot;color:#5c7a4e&quot;&gt;alta&lt;/strong&gt; — dentro de ventana fértil.&#x27;;
    } else if (diaRelCiclo === diaOvul) {
      evalText = `La relación ocurrió exactamente en el día de la ovulación estimada (día ${diaRelCiclo}, ${fmt(relacion)}).`;
      prob = &#x27;🟢 Probabilidad de concepción: &lt;strong style=&quot;color:#5c7a4e&quot;&gt;muy alta&lt;/strong&gt; — día de ovulación.&#x27;;
    } else if (diaRelCiclo === diaOvul + 1) {
      evalText = `La relación ocurrió el día ${diaRelCiclo} del ciclo (${fmt(relacion)}), un día después de la ovulación. El óvulo permanece viable 12–24 horas post-ovulación.`;
      prob = &#x27;🟡 Probabilidad de concepción: &lt;strong style=&quot;color:#c9975a&quot;&gt;posible&lt;/strong&gt; — óvulo aún viable.&#x27;;
    } else {
      evalText = `La relación ocurrió el día ${diaRelCiclo} del ciclo (${fmt(relacion)}), fuera de la ventana fértil (post-ovulatoria).`;
      prob = &#x27;⚠️ Probabilidad de concepción: &lt;strong style=&quot;color:#c8687a&quot;&gt;muy baja&lt;/strong&gt; — fuera de ventana fértil.&#x27;;
    }

    document.getElementById(&#x27;r-relacion-eval&#x27;).innerHTML = `${evalText}&lt;br&gt;&lt;br&gt;${prob}`;
    document.getElementById(&#x27;card-relacion&#x27;).style.display = &#x27;block&#x27;;
  } else {
    document.getElementById(&#x27;card-relacion&#x27;).style.display = &#x27;none&#x27;;
  }

  const hcgInicial = parseFloat(document.getElementById(&#x27;hcg-inicial&#x27;).value) || 5;
  const horasDuplicacion = parseInt(document.getElementById(&#x27;hcg-duplicacion&#x27;).value) || 60;

  // ── β-hCG estimada hoy ──────────────────────────────────────────────
  const diasPostImplHoy = diffDays(implantacion, hoy);
  if (diasPostImplHoy &gt;= 0) {
    const horasT = diasPostImplHoy * 24;
    const dupCount = (horasT / horasDuplicacion).toFixed(1);

    // Valor puntual
    const hcgCalc = hcgInicial * Math.pow(2, horasT / horasDuplicacion);

    // ── 1. IC 95% por propagación log-normal (CV biológico 30%) ──────
    // σ_ln = sqrt(ln(1 + CV²))  donde CV = 0.30
    const CV = 0.30;
    const sigma_ln = Math.sqrt(Math.log(1 + CV * CV));
    // En escala log: μ_ln = ln(hcgCalc), σ_ln se acumula con las duplicaciones
    // Factor de incertidumbre crece con el tiempo: σ_total = sigma_ln × sqrt(dupCount)
    const dupCountNum = horasT / horasDuplicacion;
    const sigma_total = sigma_ln * Math.sqrt(Math.max(dupCountNum, 1));
    const z95 = 1.96;
    const ic95Lo = hcgCalc * Math.exp(-z95 * sigma_total);
    const ic95Hi = hcgCalc * Math.exp( z95 * sigma_total);

    // ── 2. Rangos de referencia ECLIA del laboratorio (por semana gestacional) ──
    // Fuente: valores de referencia propios del laboratorio (método ECLIA)
    // [semEG_min, semEG_max, rango_min, rango_max]
    const eclia = [
      [3,  4,  5,      50],
      [4,  5,  5,      420],
      [5,  6,  20,     7300],
      [6,  7,  1050,   56700],
      [7,  8,  7600,   230000],
      [9,  12, 25000,  295000],
      [13, 16, 14000,  250000],
      [17, 24, 4090,   165200],
      [24, 40, 3650,   119000],
    ];
    const egSemActual = semanas;
    let ecliaMin = null, ecliaMax = null, ecliaLabel = &#x27;&#x27;;
    for (const [s0, s1, lo, hi] of eclia) {
      if (egSemActual &gt;= s0 &amp;&amp; egSemActual &lt; s1) {
        ecliaMin = lo; ecliaMax = hi;
        ecliaLabel = `${s0}–${s1} sem`;
        break;
      }
    }
    // Calcular P50 estimado como media geométrica del rango ECLIA
    const ecliaP50 = (ecliaMin &amp;&amp; ecliaMax) ? Math.sqrt(ecliaMin * ecliaMax) : null;

    // Verificar si el valor calculado está dentro del rango ECLIA
    let ecliaStatus = &#x27;&#x27;;
    if (ecliaMin !== null) {
      if (hcgCalc &lt; ecliaMin) ecliaStatus = &#x27;⬇️ Por debajo del rango&#x27;;
      else if (hcgCalc &gt; ecliaMax) ecliaStatus = &#x27;⬆️ Por encima del rango&#x27;;
      else ecliaStatus = &#x27;✅ Dentro del rango&#x27;;
    }

    // ── 3. Rango por velocidad de duplicación (48–72 h) ──────────────
    const hcgMin72 = hcgInicial * Math.pow(2, horasT / 72);
    const hcgMax48 = hcgInicial * Math.pow(2, horasT / 48);

    // ── Actualizar DOM ────────────────────────────────────────────────
    const r = v =&gt; Math.round(v).toLocaleString();
    document.getElementById(&#x27;r-hcg-hoy&#x27;).textContent = `${r(hcgCalc)} mUI/mL`;
    document.getElementById(&#x27;r-hcg-duplicaciones&#x27;).textContent =
      `${dupCount} duplicaciones en ${diasPostImplHoy} días (cada ${horasDuplicacion} h)`;
    document.getElementById(&#x27;r-hcg-formula&#x27;).textContent =
      `${hcgInicial} × 2^(${horasT}h ÷ ${horasDuplicacion}h) = ${r(hcgCalc)} mUI/mL`;
    document.getElementById(&#x27;r-sd-log&#x27;).textContent =
      `σ_ln = ${sigma_ln.toFixed(3)}  |  σ_total (${dupCountNum.toFixed(1)} dup.) = ${sigma_total.toFixed(3)}`;

    // Tabla IC 95%
    document.getElementById(&#x27;r-ic95-lo&#x27;).textContent  = `${r(ic95Lo)} mUI/mL`;
    document.getElementById(&#x27;r-ic95-mid&#x27;).textContent = `${r(hcgCalc)} mUI/mL`;
    document.getElementById(&#x27;r-ic95-hi&#x27;).textContent  = `${r(ic95Hi)} mUI/mL`;

    // Tabla ECLIA laboratorio
    document.getElementById(&#x27;r-barn-p5&#x27;).textContent  = ecliaMin  ? `${r(ecliaMin)} mUI/mL`  : &#x27;N/D&#x27;;
    document.getElementById(&#x27;r-barn-p50&#x27;).textContent = ecliaP50  ? `${r(ecliaP50)} mUI/mL`  : &#x27;N/D&#x27;;
    document.getElementById(&#x27;r-barn-p95&#x27;).textContent = ecliaMax  ? `${r(ecliaMax)} mUI/mL`  : &#x27;N/D&#x27;;

    // Mostrar status dentro/fuera de rango ECLIA
    const ecliaStatusEl = document.getElementById(&#x27;r-eclia-status&#x27;);
    if (ecliaStatusEl) {
      ecliaStatusEl.textContent = ecliaMin ? `${ecliaStatus} ECLIA (${ecliaLabel})` : &#x27;&#x27;;
      ecliaStatusEl.style.color = hcgCalc &lt; ecliaMin ? &#x27;#c8687a&#x27; : hcgCalc &gt; ecliaMax ? &#x27;#c9975a&#x27; : &#x27;#4a7a4a&#x27;;
    }

    // Tabla rango duplicación
    document.getElementById(&#x27;r-dup-lo&#x27;).textContent  = `${r(hcgMin72)} mUI/mL`;
    document.getElementById(&#x27;r-dup-mid&#x27;).textContent = `${r(hcgCalc)} mUI/mL`;
    document.getElementById(&#x27;r-dup-hi&#x27;).textContent  = `${r(hcgMax48)} mUI/mL`;

    // Barra visual (escala log)
    const logLo  = Math.log10(Math.max(ic95Lo, 1));
    const logHi  = Math.log10(Math.max(ic95Hi, 1));
    const logMid = Math.log10(Math.max(hcgCalc, 1));
    const logMin = Math.max(logLo - 0.5, 0);
    const logMax = logHi + 0.5;
    const pctLo  = ((logLo - logMin) / (logMax - logMin) * 100).toFixed(1);
    const pctHi  = ((logHi - logMin) / (logMax - logMin) * 100).toFixed(1);
    const pctMid = ((logMid - logMin) / (logMax - logMin) * 100).toFixed(1);
    const barEl  = document.getElementById(&#x27;r-bar-ic&#x27;);
    const dotEl  = document.getElementById(&#x27;r-bar-punto&#x27;);
    barEl.style.left  = `${pctLo}%`;
    barEl.style.width = `${pctHi - pctLo}%`;
    dotEl.style.left  = `${pctMid}%`;
    document.getElementById(&#x27;r-bar-lo-lbl&#x27;).textContent  = `${r(ic95Lo)}`;
    document.getElementById(&#x27;r-bar-mid-lbl&#x27;).textContent = `▲ ${r(hcgCalc)} mUI/mL`;
    document.getElementById(&#x27;r-bar-hi-lbl&#x27;).textContent  = `${r(ic95Hi)}`;

    document.getElementById(&#x27;r-hcg-estadistica&#x27;).style.display = &#x27;block&#x27;;

  } else {
    document.getElementById(&#x27;r-hcg-hoy&#x27;).textContent = &#x27;Aún no aplica&#x27;;
    document.getElementById(&#x27;r-hcg-duplicaciones&#x27;).textContent = &#x27;La implantación no ha ocurrido aún&#x27;;
    document.getElementById(&#x27;r-hcg-estadistica&#x27;).style.display = &#x27;none&#x27;;
  }

  // Curva β-hCG — rangos ECLIA del laboratorio por semana gestacional
  const diasPostImpl = diffDays(implantacion, hoy);
  // [semana EG inicio, semana EG fin, label, min, max]
  const puntosEclia = [
    { semLo: 3,  semHi: 4,  label: &#x27;3–4 sem&#x27;,   min: 5,     max: 50 },
    { semLo: 4,  semHi: 5,  label: &#x27;4–5 sem&#x27;,   min: 5,     max: 420 },
    { semLo: 5,  semHi: 6,  label: &#x27;5–6 sem&#x27;,   min: 20,    max: 7300 },
    { semLo: 6,  semHi: 7,  label: &#x27;6–7 sem&#x27;,   min: 1050,  max: 56700 },
    { semLo: 7,  semHi: 8,  label: &#x27;7–8 sem&#x27;,   min: 7600,  max: 230000 },
    { semLo: 9,  semHi: 12, label: &#x27;9–12 sem&#x27;,  min: 25000, max: 295000 },
    { semLo: 13, semHi: 16, label: &#x27;13–16 sem&#x27;, min: 14000, max: 250000 },
    { semLo: 17, semHi: 24, label: &#x27;17–24 sem&#x27;, min: 4090,  max: 165200 },
    { semLo: 24, semHi: 40, label: &#x27;24–40 sem&#x27;, min: 3650,  max: 119000 },
  ];

  const tbody = document.getElementById(&#x27;r-hcg-body&#x27;);
  tbody.innerHTML = &#x27;&#x27;;
  puntosEclia.forEach(p =&gt; {
    const esCurrent = semanas &gt;= p.semLo &amp;&amp; semanas &lt; p.semHi;
    const tr = document.createElement(&#x27;tr&#x27;);
    if (esCurrent) tr.className = &#x27;current&#x27;;
    tr.innerHTML = `
      &lt;td&gt;${p.label}${esCurrent ? &#x27;&lt;span class=&quot;badge-current&quot;&gt;ACTUAL&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/td&gt;
      &lt;td&gt;${p.min.toLocaleString()} mUI/mL&lt;/td&gt;
      &lt;td&gt;${p.max.toLocaleString()} mUI/mL&lt;/td&gt;
    `;
    tbody.appendChild(tr);
  });

  document.getElementById(&#x27;resultados&#x27;).style.display = &#x27;block&#x27;;
  document.getElementById(&#x27;resultados&#x27;).scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
}

/* ══════════════════════════════════════════
   EVALUADOR DE DUPLICACIÓN β-hCG
════════════════════════════════════════════ */
function evaluarDuplicacion() {
  const f1 = document.getElementById(&#x27;dup-fecha1&#x27;).value;
  const f2 = document.getElementById(&#x27;dup-fecha2&#x27;).value;
  const v1 = parseFloat(document.getElementById(&#x27;dup-val1&#x27;).value);
  const v2 = parseFloat(document.getElementById(&#x27;dup-val2&#x27;).value);

  if (!f1 || !f2 || isNaN(v1) || isNaN(v2)) {
    alert(&#x27;Por favor completa todos los campos.&#x27;); return;
  }

  const fecha1 = new Date(f1 + &#x27;T00:00:00&#x27;);
  const fecha2 = new Date(f2 + &#x27;T00:00:00&#x27;);
  const horasEntre = diffDays(fecha1, fecha2) * 24;

  if (horasEntre &lt;= 0) { alert(&#x27;La segunda fecha debe ser posterior a la primera.&#x27;); return; }
  if (v2 &lt;= 0 || v1 &lt;= 0) { alert(&#x27;Los valores de β-hCG deben ser mayores a 0.&#x27;); return; }

  // Incremento porcentual
  const incremento = ((v2 - v1) / v1) * 100;
  // Tiempo de duplicación real (horas)
  const tDup = (horasEntre * Math.log(2)) / Math.log(v2 / v1);
  // Valor esperado a 48 h y 72 h
  const esperado48 = v1 * Math.pow(2, horasEntre / 48);
  const esperado72 = v1 * Math.pow(2, horasEntre / 72);
  // Incremento mínimo esperado a las horas transcurridas (basado en t½ de 72h = 66% en 48h)
  const incrementoMinimo48h = 66; // %

  let clase, icono, interpretacion, detalle;

  if (v2 &lt; v1) {
    clase = &#x27;caida&#x27;;
    icono = &#x27;🔴&#x27;;
    interpretacion = &#x27;Caída de β-hCG&#x27;;
    detalle = `El valor descendió un ${Math.abs(incremento).toFixed(1)}%. Esto es sugestivo de &lt;strong&gt;aborto en evolución, embarazo anembrionado o embarazo bioquímico&lt;/strong&gt;. Requiere evaluación clínica urgente.`;
  } else if (tDup &lt;= 48) {
    clase = &#x27;normal&#x27;;
    icono = &#x27;🟢&#x27;;
    interpretacion = &#x27;Duplicación excelente&#x27;;
    detalle = `Tiempo de duplicación: &lt;strong&gt;${tDup.toFixed(1)} h&lt;/strong&gt; (≤ 48 h). Patrón muy favorable para embarazo intrauterino viable.`;
  } else if (tDup &lt;= 72) {
    clase = &#x27;normal&#x27;;
    icono = &#x27;🟢&#x27;;
    interpretacion = &#x27;Duplicación normal&#x27;;
    detalle = `Tiempo de duplicación: &lt;strong&gt;${tDup.toFixed(1)} h&lt;/strong&gt; (48–72 h). Dentro del rango normal. Patrón compatible con embarazo viable.`;
  } else if (tDup &lt;= 96) {
    clase = &#x27;lento&#x27;;
    icono = &#x27;🟡&#x27;;
    interpretacion = &#x27;Duplicación lenta&#x27;;
    detalle = `Tiempo de duplicación: &lt;strong&gt;${tDup.toFixed(1)} h&lt;/strong&gt; (&gt; 72 h). Por debajo de lo esperado. Considerar: embarazo ectópico, aborto en evolución o variabilidad biológica. Repetir determinación en 48 h.`;
  } else {
    clase = &#x27;caida&#x27;;
    icono = &#x27;🔴&#x27;;
    interpretacion = &#x27;Duplicación muy lenta — alerta&#x27;;
    detalle = `Tiempo de duplicación: &lt;strong&gt;${tDup.toFixed(1)} h&lt;/strong&gt; (&gt; 96 h). Patrón anormal. Alta sospecha de &lt;strong&gt;embarazo ectópico o pérdida gestacional&lt;/strong&gt;. Evaluación clínica y ecográfica urgente.`;
  }

  const div = document.getElementById(&#x27;dup-resultado&#x27;);
  div.style.display = &#x27;block&#x27;;
  div.innerHTML = `
    &lt;div class=&quot;dup-result ${clase}&quot;&gt;
      &lt;span class=&quot;dup-big&quot;&gt;${icono} ${interpretacion}&lt;/span&gt;
      Incremento: &lt;strong&gt;${incremento.toFixed(1)}%&lt;/strong&gt; en ${horasEntre} horas&lt;br&gt;
      Tiempo de duplicación real: &lt;strong&gt;${isFinite(tDup) &amp;&amp; tDup &gt; 0 ? tDup.toFixed(1) + &#x27; h&#x27; : &#x27;No calculable&#x27;}&lt;/strong&gt;&lt;br&gt;
      Valor esperado (48 h): ~${Math.round(esperado48).toLocaleString()} mUI/mL &amp;nbsp;|&amp;nbsp; (72 h): ~${Math.round(esperado72).toLocaleString()} mUI/mL&lt;br&gt;&lt;br&gt;
      ${detalle}
    &lt;/div&gt;
    &lt;p class=&quot;note&quot; style=&quot;margin-top:10px&quot;&gt;Interpretación basada en criterios de Barnhart et al. Un resultado anormal siempre debe correlacionarse con clínica y ecografía.&lt;/p&gt;
  `;
}

/* ══════════════════════════════════════════
   LCC → EDAD GESTACIONAL
════════════════════════════════════════════ */
function calcularLCC() {
  const lcc = parseFloat(document.getElementById(&#x27;lcc-mm&#x27;).value);
  const fechaEcoVal = document.getElementById(&#x27;lcc-fecha&#x27;).value;

  if (isNaN(lcc) || lcc &lt;= 0) { alert(&#x27;Ingresa un valor de LCC válido (mm).&#x27;); return; }
  if (!fechaEcoVal) { alert(&#x27;Ingresa la fecha de la ecografía.&#x27;); return; }

  if (lcc &lt; 2 || lcc &gt; 84) {
    alert(&#x27;La fórmula de Robinson es válida para LCC entre 2 y 84 mm (6–14 semanas).&#x27;); return;
  }

  // Fórmula de Robinson (1975): EG (días) = 8.052 × √LCC + 23.73
  const egDias = Math.round(8.052 * Math.sqrt(lcc) + 23.73);
  const egSemanas = Math.floor(egDias / 7);
  const egDiasResto = egDias % 7;

  const fechaEco = new Date(fechaEcoVal + &#x27;T00:00:00&#x27;);
  // FPP ecográfica: fecha eco - días gestacionales + 280
  const fppEco = addDays(fechaEco, 280 - egDias);
  // FUR ecográfica estimada
  const furEco = addDays(fechaEco, -egDias);

  // Margen de error ± 5 días (primer trimestre)
  const fppMin = addDays(fppEco, -5);
  const fppMax = addDays(fppEco, 5);

  const div = document.getElementById(&#x27;lcc-resultado&#x27;);
  div.style.display = &#x27;block&#x27;;
  div.innerHTML = `
    &lt;div class=&quot;lcc-result&quot;&gt;
      &lt;div class=&quot;lcc-big&quot;&gt;${egSemanas} sem ${egDiasResto} días&lt;/div&gt;
      &lt;div class=&quot;lcc-sub&quot;&gt;LCC ${lcc} mm → ${egDias} días gestacionales (Robinson)&lt;/div&gt;
      &lt;div class=&quot;lcc-fpp&quot;&gt;
        FPP ecográfica: &lt;strong&gt;${fmtFull(fppEco)}&lt;/strong&gt;&lt;br&gt;
        Rango (± 5 días): ${fmt(fppMin)} – ${fmt(fppMax)}&lt;br&gt;
        FUR estimada ecográficamente: ${fmt(furEco)}
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot; style=&quot;margin-top:10px&quot;&gt;Fórmula de Robinson (1975), válida entre 6–14 semanas. Margen de error ± 3–5 días. En caso de discrepancia &gt; 7 días con la FUR, la edad gestacional ecográfica tiene prioridad clínica.&lt;/p&gt;
  `;
}

/* ══════════════════════════════════════════
   PRÓXIMA MENSTRUACIÓN
════════════════════════════════════════════ */
function calcularMenstruacion() {
  const furVal = document.getElementById(&#x27;mens-fur&#x27;).value;
  const ciclo = parseInt(document.getElementById(&#x27;mens-ciclo&#x27;).value) || 28;

  if (!furVal) { alert(&#x27;Ingresa la fecha de última regla.&#x27;); return; }

  const fur = new Date(furVal + &#x27;T00:00:00&#x27;);
  const hoy = new Date(); hoy.setHours(0,0,0,0);

  const proximaRegla = addDays(fur, ciclo);
  const diasFaltantes = diffDays(hoy, proximaRegla);

  // Prueba de embarazo: 1 día después del retraso (ciclo + 1)
  const pruebaEmbarazo = addDays(fur, ciclo + 1);
  // Ventana de detección óptima β-hCG en orina: ciclo + 1 a ciclo + 5
  const pruebaOptima = addDays(fur, ciclo + 3);

  let estadoTexto, estadoColor;
  if (diasFaltantes &gt; 0) {
    estadoTexto = `Faltan &lt;strong&gt;${diasFaltantes} día${diasFaltantes &gt; 1 ? &#x27;s&#x27; : &#x27;&#x27;}&lt;/strong&gt; para la próxima regla esperada.`;
    estadoColor = &#x27;var(--plum)&#x27;;
  } else if (diasFaltantes === 0) {
    estadoTexto = `&lt;strong&gt;Hoy&lt;/strong&gt; es la fecha esperada de la próxima regla.`;
    estadoColor = &#x27;var(--gold)&#x27;;
  } else {
    estadoTexto = `Lleva &lt;strong&gt;${Math.abs(diasFaltantes)} día${Math.abs(diasFaltantes) &gt; 1 ? &#x27;s&#x27; : &#x27;&#x27;} de retraso&lt;/strong&gt; menstrual.`;
    estadoColor = &#x27;var(--rose)&#x27;;
  }

  const div = document.getElementById(&#x27;mens-resultado&#x27;);
  div.style.display = &#x27;block&#x27;;
  div.innerHTML = `
    &lt;div class=&quot;mens-result&quot;&gt;
      &lt;div style=&quot;font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px&quot;&gt;Próxima menstruación esperada&lt;/div&gt;
      &lt;div class=&quot;mens-big&quot;&gt;${fmtFull(proximaRegla)}&lt;/div&gt;
      &lt;div class=&quot;mens-sub&quot; style=&quot;color:${estadoColor};margin-top:8px;font-weight:500&quot;&gt;${estadoTexto}&lt;/div&gt;
    &lt;/div&gt;
    &lt;table class=&quot;hcg-table&quot; style=&quot;margin-top:14px&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Evento&lt;/th&gt;&lt;th&gt;Fecha&lt;/th&gt;&lt;th&gt;Acción&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Regla esperada&lt;/td&gt;&lt;td&gt;${fmt(proximaRegla)}&lt;/td&gt;&lt;td style=&quot;color:var(--muted);font-size:0.82rem&quot;&gt;Si no aparece...&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Test de embarazo (orina)&lt;/td&gt;&lt;td&gt;${fmt(pruebaEmbarazo)}&lt;/td&gt;&lt;td style=&quot;color:var(--plum-mid);font-size:0.82rem&quot;&gt;1 día post-retraso&lt;/td&gt;&lt;/tr&gt;
        &lt;tr class=&quot;current&quot;&gt;&lt;td&gt;Test óptimo &lt;span class=&quot;badge-current&quot;&gt;IDEAL&lt;/span&gt;&lt;/td&gt;&lt;td&gt;${fmt(pruebaOptima)}&lt;/td&gt;&lt;td style=&quot;color:var(--plum-mid);font-size:0.82rem&quot;&gt;3 días post-retraso&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;β-hCG en sangre&lt;/td&gt;&lt;td&gt;${fmt(pruebaEmbarazo)}&lt;/td&gt;&lt;td style=&quot;color:var(--plum-mid);font-size:0.82rem&quot;&gt;Desde día de retraso&lt;/td&gt;&lt;/tr&gt;
